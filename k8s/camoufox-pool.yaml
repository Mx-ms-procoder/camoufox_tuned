apiVersion: apps/v1
kind: Deployment
metadata:
  name: camoufox-warm-pool
  labels:
    app: camoufox-worker
spec:
  replicas: 5 # Warm pool size
  selector:
    matchLabels:
      app: camoufox-worker
  template:
    metadata:
      labels:
        app: camoufox-worker
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: camoufox-worker
      containers:
      - name: camoufox-browser
        image: camoufox-slim:latest
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        env:
        - name: PROXY_HOST
          value: "127.0.0.1:8080"
        - name: CAMOUFOX_STORE_BACKEND
          value: "redis"
        - name: CAMOUFOX_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: camoufox-redis
              key: url
              optional: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 1
          periodSeconds: 2
          failureThreshold: 10
        volumeMounts:
        - name: proxy-config
          mountPath: /etc/camoufox/network
      - name: utls-sidecar
        image: camoufox-slim:latest
        command: ["/usr/local/bin/utls_proxy"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        env:
        # NOTE: keep this in sync with the image's CAMOU_UTLS_PROFILE
        # default. firefox150 is the audited target browser; the previous
        # firefox135 value drifted from the rest of the stack.
        - name: CAMOU_UTLS_PROFILE
          value: "firefox150"
        - name: CAMOU_UTLS_LISTEN
          value: ":8080"
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 5
      volumes:
      - name: proxy-config
        configMap:
          name: camoufox-network-templates
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: camoufox-pool
spec:
  selector:
    app: camoufox-worker
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: camoufox-pool-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: camoufox-warm-pool
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Pods
        value: 3
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
