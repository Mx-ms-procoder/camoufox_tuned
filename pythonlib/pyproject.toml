[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "camoufox"
version = "0.4.13"
description = "Wrapper around Playwright to help launch Camoufox"
authors = ["daijro <daijro.dev@gmail.com>"]
license = "MIT"
repository = "https://github.com/Mx-ms-procoder/camoufox_tuned"
homepage = "https://camoufox.com/python"
readme = "README.md"
keywords = [
    "client",
    "fingerprint",
    "browser",
    "scraping",
    "injector",
    "firefox",
    "playwright",
]
classifiers = [
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
# Tested with the bundled Juggler protocol and Playwright 1.62.
python = "^3.11"
click = ">=8.3.3,<9"
requests = ">=2.33.0,<3"
orjson = ">=3.11.6,<4"
browserforge = "^1.2.1"
playwright = ">=1.62.0,<1.63"
pyyaml = ">=6.0.2"
platformdirs = ">=4.3.6"
tqdm = ">=4.66.5"
numpy = ">=1.26.4"
ua_parser = ">=1.0.0"
typing_extensions = ">=4.12.2"
screeninfo = ">=0.8.1"
lxml = ">=6.1.0,<7"
language-tags = ">=1.2.0"
pysocks = ">=1.7.1"
geoip2 = {version = ">=4.8.0", optional = true}
redis = {version = ">=5.1.1", optional = true}
boto3 = {version = ">=1.35.0", optional = true}

[tool.poetry.extras]
geoip = ["geoip2"]
redis = ["redis"]
s3 = ["boto3"]
cloud = ["redis", "boto3"]

[tool.poetry.scripts]
camoufox = "camoufox.__main__:cli"
