name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x86_64
            runner: ubuntu-24.04
          - target: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: linux
            arch: i686
            runner: ubuntu-24.04
          - target: windows
            arch: x86_64
            runner: ubuntu-24.04
          - target: windows
            arch: i686
            runner: ubuntu-24.04
          - target: macos
            arch: x86_64
            runner: ubuntu-24.04
          - target: macos
            arch: arm64
            runner: ubuntu-24.04

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null || true
          sudo apt-get remove -y '^dotnet-.*' > /dev/null || true
          sudo apt-get remove -y '^llvm-.*' > /dev/null || true
          sudo apt-get remove -y 'php.*' > /dev/null || true
          sudo apt-get remove -y '^mongodb-.*' > /dev/null || true
          sudo apt-get remove -y '^mysql-.*' > /dev/null || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL:-} mono-devel libgl1-mesa-dri --fix-missing > /dev/null || true
          if [[ (${CODENAME:-} = focal) || (${CODENAME:-} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null || true
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null || true
          fi
          sudo apt-get autoremove -y > /dev/null || true
          sudo apt-get clean > /dev/null || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18 llvm-18 libclang-18-dev
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo update-alternatives --install /usr/bin/lld-link lld-link /usr/bin/lld-link-18 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-18 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential cbindgen msitools p7zip-full aria2 zip unzip nasm yasm nodejs pkg-config libasound2-dev libgtk-3-dev libdbus-glib-1-dev libpulse-dev libx11-xcb-dev libxt-dev
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo apt-get install -y libasound2-dev:i386 libgtk-3-dev:i386 libdbus-glib-1-dev:i386 libpulse-dev:i386 libx11-xcb-dev:i386 libxt-dev:i386
          fi
          if [ "${{ matrix.target }}" = "windows" ]; then
            sudo apt-get install -y --no-install-recommends wine wine64 zstd
          fi
          if [ "${{ matrix.target }}" = "windows" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/windres
            sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/x86_64-mingw32-windres
            sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/x86_64-pc-mingw32-windres
          fi
          if [ "${{ matrix.target }}" = "windows" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686
            sudo ln -sf /usr/bin/i686-w64-mingw32-windres /usr/local/bin/windres
            sudo ln -sf /usr/bin/i686-w64-mingw32-windres /usr/local/bin/i686-mingw32-windres
            sudo ln -sf /usr/bin/i686-w64-mingw32-windres /usr/local/bin/i686-pc-mingw32-windres
          fi
          if [ "${{ matrix.target }}" = "macos" ]; then
            sudo apt-get install -y autoconf automake cmake git libbz2-dev libgmp-dev liblzma-dev libmpc-dev libmpfr-dev libssl-dev libtool libxml2-dev uuid-dev zlib1g-dev
          fi

      - name: Set up Windows Rust crate
        if: matrix.target == 'windows'
        run: |
          set -eux
          cargo install cargo-download
          mkdir -p "$HOME/windows-rs"
          cd "$HOME/windows-rs"
          cargo download -x windows=0.58.0
          echo "MOZ_WINDOWS_RS_DIR=$HOME/windows-rs/windows-0.58.0" >> "$GITHUB_ENV"

      - name: Set up Windows shader compiler
        if: matrix.target == 'windows'
        run: |
          set -eux
          FXC2_URL="https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-fxc2-r19.807d26f-1-any.pkg.tar.zst"
          FXC2_SHA256="d6f5edf6cf73ced93cb515921a11f032cd3aa8276a7270cd97b12059898ab75c"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 5 --retry-all-errors "$FXC2_URL" -o "$tmpdir/fxc2.pkg.tar.zst"
          echo "$FXC2_SHA256  $tmpdir/fxc2.pkg.tar.zst" | sha256sum -c -
          tar -C "$tmpdir" -xf "$tmpdir/fxc2.pkg.tar.zst" mingw64/bin/fxc.exe
          sudo install -m 0755 "$tmpdir/mingw64/bin/fxc.exe" /usr/local/bin/fxc2.exe
          # fxc2.cpp calls LoadLibrary() with an absolute path built from its own exe
          # directory, so d3dcompiler_47.dll MUST sit next to fxc2.exe. The msys2 fxc2
          # package does not ship the DLL, so we reuse wine's bundled copy.
          # The error message from fxc2 goes to stdout, which genshaders.py captures
          # via subprocess.check_output and discards on failure -- so a missing DLL
          # surfaces only as "non-zero exit status 1" with no diagnostic in the log.
          WINE_D3DCOMPILER=""
          for candidate in \
              /usr/lib/x86_64-linux-gnu/wine/x86_64-windows/d3dcompiler_47.dll \
              /usr/lib/wine/x86_64-windows/d3dcompiler_47.dll \
              /usr/lib64/wine/x86_64-windows/d3dcompiler_47.dll; do
            if [ -f "$candidate" ]; then
              WINE_D3DCOMPILER="$candidate"
              break
            fi
          done
          if [ -z "$WINE_D3DCOMPILER" ]; then
            echo "d3dcompiler_47.dll not found in wine install paths"
            dpkg -L libwine 2>/dev/null | grep -i d3dcompiler || true
            exit 1
          fi
          sudo install -m 0644 "$WINE_D3DCOMPILER" /usr/local/bin/d3dcompiler_47.dll
          # On Ubuntu 24.04, the wine64 binary is shipped at /usr/lib/wine/wine64
          # (not in PATH). Prefer it over /usr/bin/wine, which is the wine-launcher
          # wrapper that pulls in wine32 (unavailable on GitHub Actions runners).
          if command -v wine64 >/dev/null 2>&1; then
            WINE_BIN="$(command -v wine64)"
          elif [ -x /usr/lib/wine/wine64 ]; then
            WINE_BIN="/usr/lib/wine/wine64"
          elif command -v wine >/dev/null 2>&1; then
            WINE_BIN="$(command -v wine)"
          else
            echo "wine executable not found"
            exit 1
          fi
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine64
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine
          # Override /usr/bin/wine to use wine64 (wine32 unavailable on Ubuntu 24.04 runners).
          # Skip when WINE_BIN is /usr/bin/wine itself, otherwise the symlink would loop on itself.
          if [ "$WINE_BIN" != "/usr/bin/wine" ]; then
            sudo ln -sf "$WINE_BIN" /usr/bin/wine
          fi
          # Pre-initialize a 64-bit wine prefix to avoid wine32 init errors during build
          WINEARCH=win64 WINEPREFIX="$HOME/.wine64" WINEDEBUG=-all "$WINE_BIN" wineboot --init 2>/dev/null || true
          # Install the wine-fxc-wrapper from a checked-in script file. We used
          # to inline this via a here-document, but YAML's block-scalar handling
          # made the resulting script fragile (and surfaces obscure failures
          # like ENOEXEC on the shebang line). Reading from a known-good file
          # avoids any indentation/escaping surprises.
          sudo install -m 0755 "$GITHUB_WORKSPACE/scripts/wine-fxc-wrapper.sh" /usr/local/bin/wine-fxc-wrapper
          # Also drop d3dcompiler_47.dll into the wine prefix's system32 so
          # LoadLibrary() can resolve it via DLL search order even when wine
          # falls back from the exe-adjacent path lookup.
          mkdir -p "$HOME/.wine64/drive_c/windows/system32"
          install -m 0644 "$WINE_D3DCOMPILER" "$HOME/.wine64/drive_c/windows/system32/d3dcompiler_47.dll"
          echo "WINE=/usr/local/bin/wine-fxc-wrapper" >> "$GITHUB_ENV"
          echo "WINEARCH=win64" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$HOME/.wine64" >> "$GITHUB_ENV"
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"
          command -v fxc2.exe
          "$WINE_BIN" --version
          /usr/local/bin/wine-fxc-wrapper --version
          # Sanity-check the wrapper is invocable through execve (not just via
          # bash fallback). Python's subprocess uses execve directly, so a
          # broken shebang would cause the build to silently fall back to a
          # raw wine binary and re-introduce the HLSL path bug.
          python3 -c "import subprocess; print(subprocess.check_output(['/usr/local/bin/wine-fxc-wrapper', '--version']).decode().strip())"

      - name: Cache macOS cross toolchain
        if: matrix.target == 'macos'
        uses: actions/cache@v4
        with:
          path: ~/.mozbuild/osxcross
          key: osxcross-macosx14.4-compiler-rt-v1

      - name: Setup macos toolchain
        if: matrix.target == 'macos'
        run: |
          set -eux
          clone_osxcross() {
            local attempt=1
            local max_attempts=5
            until git clone --depth 1 https://github.com/tpoechtrager/osxcross.git "$OSXCROSS_DIR"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              rm -rf "$OSXCROSS_DIR"
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }
          build_osxcross() {
            local attempt=1
            local max_attempts=5
            until env UNATTENDED=1 OSX_VERSION_MIN=10.15 ./build.sh; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              rm -rf build/apple-libtapi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }
          build_osxcross_compiler_rt() {
            # Pre-create the compiler-rt install directories to avoid permission errors.
            # osxcross's build_compiler_rt.sh installs into the host LLVM tree,
            # which is owned by root on GitHub Actions runners.
            sudo mkdir -p /usr/lib/llvm-18/lib/clang/18/lib/darwin
            sudo chmod -R 777 /usr/lib/llvm-18/lib/clang/18/lib/darwin
            sudo mkdir -p /usr/lib/llvm-18/lib/clang/18/include
            sudo chmod -R 777 /usr/lib/llvm-18/lib/clang/18/include
            local attempt=1
            local max_attempts=5
            until env ENABLE_COMPILER_RT_INSTALL=1 UNATTENDED=1 OSX_VERSION_MIN=10.15 ./build_compiler_rt.sh; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              rm -rf build/compiler-rt
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }
          OSXCROSS_DIR="$HOME/.mozbuild/osxcross"
          SDK_URL="https://github.com/joseluisq/macosx-sdks/releases/download/14.4/MacOSX14.4.sdk.tar.xz"
          if [ ! -x "$OSXCROSS_DIR/target/bin/o64-clang" ] || [ ! -x "$OSXCROSS_DIR/target/bin/oa64-clang" ]; then
            rm -rf "$OSXCROSS_DIR"
            clone_osxcross
            mkdir -p "$OSXCROSS_DIR/tarballs"
            curl -fsSL --retry 5 --retry-all-errors "$SDK_URL" -o "$OSXCROSS_DIR/tarballs/MacOSX14.4.sdk.tar.xz"
            cd "$OSXCROSS_DIR"
            build_osxcross
          fi
          cd "$OSXCROSS_DIR"
          CLANG_RT_OSX="$("$OSXCROSS_DIR/target/bin/o64-clang" -print-file-name=libclang_rt.osx.a || true)"
          if [ ! -f "$CLANG_RT_OSX" ]; then
            build_osxcross_compiler_rt
            CLANG_RT_OSX="$("$OSXCROSS_DIR/target/bin/o64-clang" -print-file-name=libclang_rt.osx.a || true)"
          fi
          test -f "$CLANG_RT_OSX"
          echo "CLANG_RT_OSX=$CLANG_RT_OSX" >> "$GITHUB_ENV"
          echo "OSXCROSS_ROOT=$OSXCROSS_DIR/target" >> "$GITHUB_ENV"
          echo "MACOS_SDK_DIR=$OSXCROSS_DIR/target/SDK/MacOSX14.4.sdk" >> "$GITHUB_ENV"

      - name: Fetch source
        run: |
          make fetch

      - name: Setup source
        run: |
          make setup-minimal
          mkdir -p dist

      - name: Validate patch graph
        run: python3 ./scripts/validate_patches.py

      - name: Compile Python sources
        run: python3 -m compileall pythonlib/camoufox scripts

      - name: Create swap space
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Pre-build diagnostics
        if: matrix.target == 'windows'
        run: |
          echo "=== WINE configuration ==="
          echo "WINE=${WINE:-<unset>}"
          echo "WINEARCH=${WINEARCH:-<unset>}"
          echo "WINEPREFIX=${WINEPREFIX:-<unset>}"
          echo "FXC env=${FXC:-<unset>}"
          ls -la /usr/local/bin/wine-fxc-wrapper /usr/local/bin/fxc2.exe /usr/local/bin/d3dcompiler_47.dll || true
          echo "=== Wrapper execve check ==="
          python3 -c "import subprocess; print(subprocess.check_output(['/usr/local/bin/wine-fxc-wrapper', '--version']).decode().strip())"

      - name: Build
        # Tee the entire build log to disk so we can attach it as an artifact
        # on failure. Without this, GitHub's UI truncates long output and the
        # actual error (often early C++ compile failures hidden behind a long
        # parallel rust build) is lost. Use PIPESTATUS to surface the real
        # exit code, since `tee` always succeeds.
        run: |
          set -o pipefail
          mkdir -p build-logs
          python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }} 2>&1 | tee "build-logs/build-${{ matrix.target }}-${{ matrix.arch }}.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog-${{ matrix.target }}-${{ matrix.arch }}
          path: build-logs/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
