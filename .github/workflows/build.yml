name: Build and Release

on:
  workflow_dispatch:
    inputs:
      only_target:
        description: "Build only this target to save time while iterating (linux / windows / macos). Use 'all' for the full 7-leg matrix."
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

# Opt every JavaScript action into the Node.js 24 runtime now. GitHub
# deprecated Node 20 (forced to Node 24 on 2026-06-16, removed 2026-09-16);
# this clears the "running on Node.js 20" warnings for the actions we do not
# bump by hand (setup-go, cache, upload-artifact, download-artifact) without a
# risky multi-major version jump. checkout/setup-python are additionally
# bumped to their Node 24 majors below. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-python:
    # Lightweight job that runs pythonlib unit tests and the patch conflict
    # check on every push/PR. Added per AUDIT_2026-05-15.md priority fix #6
    # (track pythonlib/tests in CI) and #4 (fail CI on unallowed hard
    # conflicts via patch.py --check-conflicts --strict).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check lockfile is in sync with requirements.txt
        # Fail fast with an actionable message if requirements.txt was edited
        # without regenerating requirements.lock. Without this, drift surfaces
        # much later as a cryptic pip HashMismatch or a silently missing
        # dependency (this exact check caught httpx[http2] being absent from
        # the lock). `packaging` is the only import the checker needs.
        run: |
          python -m pip install --quiet packaging
          python scripts/check_lockfile.py

      - name: Install dependencies
        # Use requirements.lock (hash-pinned, generated by pip-compile) so CI
        # installs are reproducible and tamper-resistant. requirements.txt
        # is the editable source; refresh the lockfile with:
        #   pip-compile --allow-unsafe --generate-hashes \
        #     --output-file=requirements.lock requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install ./pythonlib

      - name: Validate patch graph
        run: python3 ./scripts/validate_patches.py

      - name: Check patch conflicts (report-only)
        # Report-only (no --strict). After adopting upstream camoufox's coherent
        # 150 patch set, many spoofing patches intentionally edit the same
        # Window.webidl / nsGlobalWindowInner lines and compose in apply order
        # (upstream applies them sequentially). The --strict gate was tuned for
        # the fork's earlier feature-split patches and flags those by-design
        # overlaps as hard conflicts. The authoritative check that the patches
        # actually compose is apply-check, which applies them in order against
        # real Firefox source.
        run: python3 ./scripts/patch.py --check-conflicts

      - name: Run pythonlib tests
        run: pytest -q pythonlib/tests

  build-utls-proxy:
    # Compile + vet the experimental uTLS sidecar in the main CI. Previously
    # the matrix installed Go (`Set up Go`) but never built the proxy, so a
    # Go regression was only caught inside Dockerfile.slim's builder stage —
    # i.e. never in a PR. This fast job closes that gap.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet and build sidecar
        working-directory: bundle/_experimental
        run: |
          set -eux
          go vet ./...
          CGO_ENABLED=0 go build -o /tmp/utls_proxy ./utls_proxy.go

  apply-check:
    # Real apply-probe: extract Firefox $(version).$(release), git init, then
    # run `make dir` which calls scripts/patch.py to actually apply all 57
    # patches (2 numeric-prefixed playwright/juggler bootstrap patches first,
    # then the 55 manifest-claimed feature patches). If any patch has drifted
    # from the source tree (renamed file,
    # moved line, removed context), it fails here in ~5 minutes instead of
    # ~30+ minutes per worker after rust+C++ compile in the matrix. Single
    # apply-check vs. 7 matrix duplications saves ~3.5h of wasted CI on a
    # broken patchset.
    needs: test-python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimum deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full wget

      - name: Cache Firefox source tarball
        # Re-use the 677MB tarball across runs. Keyed on upstream.sh so a
        # version bump invalidates it automatically.
        uses: actions/cache@v4
        with:
          path: firefox-*.source.tar.xz
          key: firefox-source-${{ hashFiles('upstream.sh') }}-v1

      - name: Fetch source
        run: make fetch

      - name: Setup source and apply patches
        # `make dir` runs `make setup` (git init + repo-local identity +
        # initial commit + tag "unpatched") then
        # `python3 scripts/patch.py $(version) $(release)` which actually
        # applies every patch via GNU `patch` (see scripts/_mixin.py:patch).
        # The git repo is only for dev convenience (revert/checkpoint); the
        # commit/tag is why a git identity is required here. A patch failure
        # aborts here, blocking the matrix.
        env:
          BUILD_TARGET: linux,x86_64
          # This job only probes that the patches apply; it never compiles.
          # Skip rustup target installation so make dir does not depend on a
          # rust toolchain (and does not waste minutes downloading cross-target
          # std libraries). The real build matrix leaves this unset.
          CAMOUFOX_SKIP_RUSTUP: "1"
        run: |
          set -eux
          make dir
          echo "OK: all patches applied cleanly against Firefox $(grep ^version= upstream.sh | cut -d= -f2)"

  setup-matrix:
    # Emit the build matrix as JSON so a workflow_dispatch run can narrow it to
    # a single platform (only_target) while iterating, without re-compiling the
    # already-green legs. For tag pushes / PRs (and only_target=all) the full
    # 7-leg matrix is produced. Cheap (<10s), so it always runs.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: gen
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only_target || 'all' }}
        run: |
          set -eu
          full='[
            {"target":"linux","arch":"x86_64","runner":"ubuntu-24.04"},
            {"target":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},
            {"target":"linux","arch":"i686","runner":"ubuntu-24.04"},
            {"target":"windows","arch":"x86_64","runner":"ubuntu-24.04"},
            {"target":"windows","arch":"i686","runner":"ubuntu-24.04"},
            {"target":"macos","arch":"x86_64","runner":"ubuntu-24.04"},
            {"target":"macos","arch":"arm64","runner":"ubuntu-24.04"}
          ]'
          if [ "$ONLY" = "all" ]; then
            sel=$(echo "$full" | jq -c '{include: .}')
          else
            sel=$(echo "$full" | jq -c --arg t "$ONLY" '{include: [.[] | select(.target==$t)]}')
          fi
          echo "Selected matrix for ONLY='$ONLY': $sel"
          echo "matrix=$sel" >> "$GITHUB_OUTPUT"

  build:
    # Gate the 7-arch matrix build on test-python AND apply-check: pure-
    # python validators must pass and the patches must actually apply
    # against the freshly-extracted Firefox source before we burn CI
    # minutes on the cross builds.
    # The matrix is generated by setup-matrix so a workflow_dispatch run can
    # build a single platform (only_target) without re-compiling the already-
    # green legs. Tag pushes and PRs always get the full 7-leg matrix.
    needs: [test-python, build-utls-proxy, apply-check, setup-matrix]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Maximize build space
        # Pinned to the immutable commit SHA of tag v4.1 (supply-chain
        # hardening: a moved tag can no longer inject code into our runner).
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null || true
          sudo apt-get remove -y '^dotnet-.*' > /dev/null || true
          sudo apt-get remove -y '^llvm-.*' > /dev/null || true
          sudo apt-get remove -y 'php.*' > /dev/null || true
          sudo apt-get remove -y '^mongodb-.*' > /dev/null || true
          sudo apt-get remove -y '^mysql-.*' > /dev/null || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL:-} mono-devel libgl1-mesa-dri --fix-missing > /dev/null || true
          if [[ (${CODENAME:-} = focal) || (${CODENAME:-} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null || true
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null || true
          fi
          sudo apt-get autoremove -y > /dev/null || true
          sudo apt-get clean > /dev/null || true

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up LLVM
        # Install LLVM 18 from Ubuntu Noble's own repos (universe) instead of
        # bootstrapping via apt.llvm.org/llvm.sh. Noble ships clang-18,
        # lld-18, llvm-18 and libclang-18-dev natively, which removes the
        # "wget | sudo bash" supply-chain TOFU and the unsigned shell-script
        # download. The package contents (clang/lld/llvm tools with -18
        # suffix) are identical to what llvm.sh would have pulled in for
        # Firefox 150's clang-18 baseline.
        run: |
          sudo apt-get update
          sudo apt-get install -y lld-18 clang-18 llvm-18 libclang-18-dev
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo update-alternatives --install /usr/bin/lld-link lld-link /usr/bin/lld-link-18 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-18 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential msitools p7zip-full aria2 wget zip unzip nasm yasm nodejs pkg-config libasound2-dev libgtk-3-dev libdbus-glib-1-dev libpulse-dev libx11-xcb-dev libxt-dev
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            # --force-overwrite is needed because libpango1.0-dev:i386 ships
            # the same arch-independent files as libpango1.0-dev:amd64 (e.g.
            # /usr/share/gir-1.0/Pango-1.0.gir) but with different content
            # between Ubuntu builds. amd64 was pulled in earlier as a
            # dependency of libgtk-3-dev (amd64). Both versions are valid
            # for our purposes, so let dpkg overwrite. Same pattern is used
            # by Mozilla's own multi-arch CI images.
            sudo apt-get install -y \
              -o Dpkg::Options::="--force-overwrite" \
              libasound2-dev:i386 libgtk-3-dev:i386 libdbus-glib-1-dev:i386 \
              libpulse-dev:i386 libx11-xcb-dev:i386 libxt-dev:i386
          fi
          if [ "${{ matrix.target }}" = "windows" ]; then
            sudo apt-get install -y --no-install-recommends wine wine64 zstd
          fi
          if [ "${{ matrix.target }}" = "windows" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
            sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/windres
            sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/x86_64-mingw32-windres
            sudo ln -sf /usr/bin/x86_64-w64-mingw32-windres /usr/local/bin/x86_64-pc-mingw32-windres
          fi
          if [ "${{ matrix.target }}" = "windows" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo apt-get install -y gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686
            sudo ln -sf /usr/bin/i686-w64-mingw32-windres /usr/local/bin/windres
            sudo ln -sf /usr/bin/i686-w64-mingw32-windres /usr/local/bin/i686-mingw32-windres
            sudo ln -sf /usr/bin/i686-w64-mingw32-windres /usr/local/bin/i686-pc-mingw32-windres
          fi
          # macOS is cross-compiled with Mozilla's bootstrapped clang + SDK
          # (see the "Bootstrap macOS cross toolchain" step). `mach bootstrap`
          # installs whatever host packages it needs itself, so no osxcross
          # build prerequisites are required here.

      - name: Fix GCC 13 MinGW headers for clang cross-compilation
        # Ubuntu Noble's gcc-mingw-w64 ships GCC 13 C++ headers that introduce
        # two breaking changes clang 18+ enforces but GCC silently tolerates:
        #
        #   1. bits/requires_hosted.h emits an #error when hosted C++ headers
        #      (<ostream>, <algorithm>, ...) are included while
        #      __STDC_HOSTED__ == 0 (i.e. under -ffreestanding). Firefox 150's
        #      browser/app/winlauncher/freestanding pulls in mozilla/Maybe.h
        #      transitively via mozglue/misc/NativeNt.h, and Maybe.h still
        #      does an unguarded `#include <ostream>` (verified 2026-05-23
        #      against FIREFOX_150_0_2_RELEASE).
        #
        #   2. cstdlib re-declares abort() and _Exit() with _GLIBCXX_NOTHROW
        #      (== noexcept), but MinGW's process.h declares them without
        #      any exception specifier. Clang 16+ rejects this as ODR.
        #
        # Mozilla's own CI builds Windows with MSVC or a non-GCC-13 MinGW,
        # so this combo never trips for them. Camoufox-only mitigation.
        if: matrix.target == 'windows'
        run: |
          set -eux
          # The MinGW libstdc++ header layout moved across GCC/Ubuntu versions,
          # which broke the old hardcoded globs (requires_hosted.h was reported
          # "not found"). Locate the files with `find` instead — layout-agnostic
          # — and treat absence as a non-fatal NOTE: if a newer GCC dropped or
          # renamed requires_hosted.h there is nothing to stub, and any real
          # -ffreestanding breakage would then surface as a clear compile error
          # rather than this preemptive guard aborting every Windows build.
          echo "=== MinGW libstdc++ headers found ==="
          find /usr \( -name requires_hosted.h -o -name cstdlib \) -path '*mingw32*' 2>/dev/null | head -40 || true

          # (1) Stub requires_hosted.h wherever it lives.
          mapfile -t rh_files < <(find /usr -path '*mingw32*' -name requires_hosted.h 2>/dev/null)
          if [ "${#rh_files[@]}" -eq 0 ]; then
            echo "NOTE: no requires_hosted.h under any MinGW tree; nothing to stub."
          else
            for f in "${rh_files[@]}"; do
              echo "/* stubbed by Camoufox CI for -ffreestanding cross-compile */" | sudo tee "$f" > /dev/null
              echo "stubbed: $f"
            done
          fi

          # (2) Strip _GLIBCXX_NOTHROW from MinGW cstdlib so abort()/_Exit() do
          # not clash with MinGW process.h declarations.
          mapfile -t cstdlib_files < <(find /usr -path '*mingw32*' -name cstdlib 2>/dev/null)
          if [ "${#cstdlib_files[@]}" -eq 0 ]; then
            echo "NOTE: no MinGW cstdlib found; skipping _GLIBCXX_NOTHROW strip."
          else
            for f in "${cstdlib_files[@]}"; do
              sudo sed -i 's/_GLIBCXX_NOTHROW//g' "$f"
              echo "stripped _GLIBCXX_NOTHROW from: $f"
            done
          fi

          # (3) Force _GLIBCXX_HOSTED=1 in MinGW c++config.h. FF150's
          # mozilla/Span.h unconditionally `#include <string>` (+ <algorithm>,
          # <array>, <iterator>), and browser/app/winlauncher/freestanding
          # reaches it transitively via NativeNt.h -> Range.h -> Span.h. The
          # generated MinGW c++config.h hardcodes `#define _GLIBCXX_HOSTED
          # __STDC_HOSTED__` (no #ifndef guard -- verified in GCC 13's
          # libstdc++ include/Makefile.in), so under -ffreestanding it resolves
          # to 0 and <bits/memoryfwd.h> then omits std::allocator, making
          # <bits/stringfwd.h> fail with "no template named 'allocator'". A
          # command-line -D cannot win against that unconditional #define, so
          # rewrite the header itself. This only affects -ffreestanding objects
          # (hosted compiles already have __STDC_HOSTED__==1 => _GLIBCXX_HOSTED
          # ==1); __STDC_HOSTED__ stays 0 so the freestanding codegen
          # guarantees (no implicit runtime-library calls) are preserved.
          mapfile -t cxxcfg_files < <(find /usr -path '*mingw32*' -name 'c++config.h' 2>/dev/null)
          if [ "${#cxxcfg_files[@]}" -eq 0 ]; then
            echo "NOTE: no MinGW c++config.h found; skipping _GLIBCXX_HOSTED override."
          else
            for f in "${cxxcfg_files[@]}"; do
              if grep -qE '^[[:space:]]*#[[:space:]]*define[[:space:]]+_GLIBCXX_HOSTED[[:space:]]+__STDC_HOSTED__' "$f"; then
                sudo sed -i -E 's/^([[:space:]]*#[[:space:]]*define[[:space:]]+_GLIBCXX_HOSTED[[:space:]]+)__STDC_HOSTED__([[:space:]]*)$/\11\2/' "$f"
                echo "forced _GLIBCXX_HOSTED=1 in: $f"
              else
                echo "NOTE: _GLIBCXX_HOSTED __STDC_HOSTED__ line not found in $f (layout changed?)"
              fi
            done
          fi

          # (4) The MinGW WinRT header windows.ui.composition.h declares COM
          # vtable slots (get_AlphaMode / get_PixelFormat) whose parameters use
          # the enums DirectXAlphaMode / DirectXPixelFormat via an *unqualified*
          # elaborated-type-specifier `enum DirectXAlphaMode *`. Those enums DO
          # exist (the header already includes windows.graphics.directx.h, which
          # defines them in namespace ABI::Windows::Graphics::DirectX) -- but the
          # reference sits inside the sibling namespace ABI::Windows::UI::
          # Composition, so unqualified name lookup never reaches them and plain
          # clang treats `enum DirectXAlphaMode` as a brand-new forward-declared
          # enum -> "ISO C++ forbids forward references to 'enum' types". (clang-cl
          # / MSVC resolve it; -fms-extensions does NOT -- it only permits opaque
          # enum *declarations*, not a dangling elaborated reference. Verified:
          # run 27562945942 still failed with -fms-extensions present.) The enums
          # are defined WITHOUT a fixed underlying type, so a forward declaration
          # is illegal too. The surgical, compiler-mode-independent fix is to
          # fully-qualify the two references so lookup finds the already-complete
          # enums. (ANGLE's Renderer11 / CompositorNativeWindow11 are the only
          # consumers.)
          mapfile -t uicomp_files < <(find /usr -path '*mingw32*' -name 'windows.ui.composition.h' 2>/dev/null)
          if [ "${#uicomp_files[@]}" -eq 0 ]; then
            echo "NOTE: no MinGW windows.ui.composition.h found; skipping enum qualification."
          else
            for f in "${uicomp_files[@]}"; do
              # Qualify EVERY elaborated reference to these two enums, whether the
              # parameter is by-pointer (`enum DirectXPixelFormat *value`) or
              # by-value (`enum DirectXPixelFormat format`). The earlier "* only"
              # pattern missed the by-value slots (run 27567298821 then failed at
              # the next interface, lines 5707/5708, on the same two enums). Anchor
              # on a word boundary after the enum name so we catch both forms and
              # never partial-match a longer identifier. Idempotent: once
              # qualified, `enum ` is followed by `::ABI...` so the bare pattern no
              # longer matches.
              if grep -qE 'enum DirectX(AlphaMode|PixelFormat)\b' "$f"; then
                sudo sed -i -E \
                  -e 's@enum DirectXAlphaMode\b@enum ::ABI::Windows::Graphics::DirectX::DirectXAlphaMode@g' \
                  -e 's@enum DirectXPixelFormat\b@enum ::ABI::Windows::Graphics::DirectX::DirectXPixelFormat@g' \
                  "$f"
                echo "qualified DirectX enum refs in: $f"
                if grep -qE 'enum DirectX(AlphaMode|PixelFormat)\b' "$f"; then
                  echo "ERROR: unqualified DirectX enum refs remain in $f"; exit 1
                fi
              else
                echo "NOTE: no unqualified DirectX enum refs in $f (already done / layout changed); skipping."
              fi

              # Same root cause for the Windows.Foundation.Numerics value types:
              # IVisual::get_Size / get_Offset are declared with `struct Vector2 *`
              # / `struct Vector3 *`, where the unqualified `Vector2` -- resolved
              # from inside namespace ABI::Windows::UI::Composition -- binds to a
              # phantom incomplete `Composition::Vector2`, NOT the real
              # ABI::Windows::Foundation::Numerics::Vector2 that ANGLE passes. The
              # struct form is legal to forward-reference, so only the actual
              # call sites error ("cannot initialize 'struct Vector2 *' with
              # 'ABI::Windows::Foundation::Numerics::Vector2 *'"); ANGLE only calls
              # get_Size (Vector2) and get_Offset (Vector3). Qualify both struct
              # references to the real Numerics types so the COM slot signatures
              # match what ANGLE passes. (Other numeric types in uncalled slots
              # stay incomplete-but-fine.) Idempotent like the enum pass.
              if grep -qE 'struct Vector[23]\b' "$f"; then
                sudo sed -i -E \
                  -e 's@struct Vector2\b@struct ::ABI::Windows::Foundation::Numerics::Vector2@g' \
                  -e 's@struct Vector3\b@struct ::ABI::Windows::Foundation::Numerics::Vector3@g' \
                  "$f"
                echo "qualified Numerics Vector2/Vector3 refs in: $f"
                if grep -qE 'struct Vector[23]\b' "$f"; then
                  echo "ERROR: unqualified struct Vector2/Vector3 refs remain in $f"; exit 1
                fi
              else
                echo "NOTE: no unqualified struct Vector2/Vector3 refs in $f (already done / layout changed); skipping."
              fi
            done
          fi

          # (5) Backfill the Windows 11-era DirectComposition interfaces that
          # Ubuntu 24.04's mingw-w64 11.0.1 dcomp.h is missing entirely. FF150's
          # gfx/webrender_bindings (DCLayerTree.cpp, RenderD3D11TextureHost.cpp)
          # uses IDCompositionDevice4 (CreateCompositionTexture /
          # CheckCompositionTextureSupport), IDCompositionTexture, and the
          # IDCompositionColorMatrixEffect / IDCompositionTableTransferEffect
          # color-management effects -- all added to mingw-w64 only AFTER 11.0.1
          # (verified: mingw-w64 v11.0.1 dcomp.h has none of them, and stubs
          # IDCompositionDevice3::CreateColorMatrixEffect/CreateTableTransferEffect
          # as `void **` TODOs). MSVC's SDK has them, so Mozilla never hits this.
          #
          # Patch the system header itself (the clean fix: it makes ALL consumers
          # compile at once and keeps every feature enabled) instead of #ifdef-ing
          # out the DComposition-texture + color-management paths in Firefox
          # source. Three edits, mirroring a newer mingw-w64 dcomp.h verbatim:
          #   a) retype Device3's two `void **` effect-factory stubs so Firefox's
          #      typed getter_AddRefs(RefPtr<...Effect>) actually binds,
          #   b) forward-declare the 4 missing interfaces before Device3 (its
          #      retyped methods reference them by pointer),
          #   c) append the 4 full interface definitions (with __CRT_UUID_DECL so
          #      __uuidof / RefPtr QueryInterface<T> resolve) before the include
          #      guard's closing #endif.
          # Idempotent + tolerant: skips any dcomp.h that already declares
          # IDCompositionDevice4 (newer toolchain, or a re-run).
          mapfile -t dcomp_files < <(find /usr -path '*mingw32*' -name dcomp.h 2>/dev/null)
          if [ "${#dcomp_files[@]}" -eq 0 ]; then
            echo "NOTE: no MinGW dcomp.h found; skipping DirectComposition backfill."
          else
            for f in "${dcomp_files[@]}"; do
              if grep -q 'IDCompositionDevice4' "$f"; then
                echo "NOTE: $f already declares IDCompositionDevice4; skipping."
                continue
              fi
              sudo python3 "${GITHUB_WORKSPACE}/scripts/ci_fix_mingw_dcomp.py" "$f"
            done
          fi

          # (6) Backfill MinGW header shims for headers Firefox/libwebrtc include
          # under a name Ubuntu 24.04's mingw-w64 11.0.1 does not provide at that
          # exact path/case. Each shim sits next to the real header and just
          # includes it -- covers every consumer at once, zero feature loss, and is
          # idempotent (the real header never includes the shim name, so no
          # recursion). Pairs are "<real header>:<shim to create>":
          #   shlobj.h:shlobj_core.h         -- the Win-SDK shell-API split; mingw
          #     ships only the monolithic <shlobj.h> superset, no <shlobj_core.h>
          #     (libwebrtc desktop_capture/win/window_capture_utils.h, x86_64).
          #   dispatcherqueue.h:DispatcherQueue.h -- mingw ships it lower-case; the
          #     Linux CI filesystem is case-sensitive so the CamelCase include fails
          #     (libwebrtc desktop_capture/win/wgc_capturer_win.h WGC path, x86_64).
          #   ks.h:Ks.h, ksmedia.h:Ksmedia.h, dvdmedia.h:Dvdmedia.h -- DirectShow /
          #     Kernel-Streaming headers, also shipped lower-case by mingw (libwebrtc
          #     video_capture/windows/device_info_ds.h includes <Ks.h>; Ksmedia /
          #     Dvdmedia pre-empted as the same KS family used by DirectShow capture).
          #   windows.h:Windows.h -- the most common CamelCase form; mingw ships only
          #     lower-case <windows.h> (libwebrtc rtc_base/system/file_wrapper.cc and
          #     others include <Windows.h>; one shim covers them all, both arches).
          for pair in "shlobj.h:shlobj_core.h" "dispatcherqueue.h:DispatcherQueue.h" \
                      "ks.h:Ks.h" "ksmedia.h:Ksmedia.h" "dvdmedia.h:Dvdmedia.h" \
                      "windows.h:Windows.h"; do
            real="${pair%%:*}"; shim="${pair##*:}"
            mapfile -t real_files < <(find /usr -path '*mingw32*' -name "$real" 2>/dev/null)
            if [ "${#real_files[@]}" -eq 0 ]; then
              echo "NOTE: no MinGW $real found; skipping $shim shim."
              continue
            fi
            for f in "${real_files[@]}"; do
              dst="$(dirname "$f")/$shim"
              if [ -e "$dst" ]; then
                echo "NOTE: $dst already exists; skipping."
              else
                printf '/* camoufox: shim for MinGW 11.0.1 missing/mis-cased %s -> redirect to %s */\n#include <%s>\n' "$shim" "$real" "$real" \
                  | sudo tee "$dst" > /dev/null
                echo "created shim: $dst -> $real"
              fi
            done
          done

          # (7) Backfill the TCP keep-alive socket-option constants into MinGW's
          # ws2ipdef.h. Ubuntu mingw-w64 11.0.1 omits TCP_KEEPCNT / TCP_KEEPIDLE /
          # TCP_KEEPINTVL (added to mingw after 11.0.1; the Windows SDK has had them
          # since the Win10 1709 SDK), so libwebrtc rtc_base/physical_socket_server.cc
          # fails with "use of undeclared identifier 'TCP_KEEPCNT'" etc. Append the
          # standard Windows values (TCP_KEEPCNT=16, TCP_KEEPIDLE=TCP_KEEPALIVE=3,
          # TCP_KEEPINTVL=17 -- verbatim from newer mingw), each #ifndef-guarded so a
          # newer toolchain that already has them wins. Appending past the include
          # guard is fine: the #ifndefs short-circuit on every re-include. Idempotent
          # via the camoufox marker.
          mapfile -t ws2_files < <(find /usr -path '*mingw32*' -name ws2ipdef.h 2>/dev/null)
          if [ "${#ws2_files[@]}" -eq 0 ]; then
            echo "NOTE: no MinGW ws2ipdef.h found; skipping TCP_KEEP* backfill."
          else
            for f in "${ws2_files[@]}"; do
              if grep -q 'camoufox: TCP keep-alive' "$f"; then
                echo "NOTE: $f already has TCP_KEEP* backfill; skipping."
              else
                printf '\n/* camoufox: TCP keep-alive options absent in mingw-w64 11.0.1; Windows values from newer mingw */\n#ifndef TCP_KEEPCNT\n#define TCP_KEEPCNT 16\n#endif\n#ifndef TCP_KEEPIDLE\n#define TCP_KEEPIDLE 3\n#endif\n#ifndef TCP_KEEPINTVL\n#define TCP_KEEPINTVL 17\n#endif\n' \
                  | sudo tee -a "$f" > /dev/null
                echo "backfilled TCP_KEEP* into $f"
              fi
            done
          fi

      - name: Install Rust toolchain (Firefox 150 baseline)
        # Firefox 150 ships with Rust 1.94.0 and source-tree MSRV is 1.90.0.
        # Sources verified:
        #   https://firefox-source-docs.mozilla.org/writing-rust-code/update-policy.html
        #   https://searchfox.org/mozilla-central/source/python/mozboot/mozboot/util.py
        #     ("MINIMUM_RUST_VERSION = "1.90.0"")
        # The previous pin to 1.86.0 was below MSRV and produced
        # "post-cargo rustc archive-pack" failures on windows-gnu (the
        # symptom that motivated the LTO disable workaround). Pinning to
        # 1.94.0 matches upstream Firefox 150 release toolchain exactly.
        run: |
          set -eux
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          # Install the cross-compile std library for the matrix target.
          # Native targets (linux x86_64 on x86_64 runner, linux arm64 on
          # arm64 runner) need no extra target install.
          case "${{ matrix.target }}-${{ matrix.arch }}" in
            linux-i686)     rustup target add i686-unknown-linux-gnu ;;
            windows-x86_64) rustup target add x86_64-pc-windows-gnu ;;
            windows-i686)   rustup target add i686-pc-windows-gnu ;;
            macos-x86_64)   rustup target add x86_64-apple-darwin ;;
            macos-arm64)    rustup target add aarch64-apple-darwin ;;
          esac
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Install cbindgen (Firefox 150 needs >= 0.29.1)
        # Ubuntu's apt cbindgen is 0.26.0, which Firefox 150 rejects
        # ("cbindgen version 0.26.0 is too old. At least version 0.29.1 is
        # required." from build/moz.configure/bindgen.configure). Install a
        # current 0.29.x from crates.io instead. --locked uses cbindgen's own
        # pinned Cargo.lock for a reproducible build.
        run: |
          set -eux
          cargo install cbindgen --version "^0.29" --locked
          cbindgen --version

      - name: Set up Windows Rust crate
        if: matrix.target == 'windows'
        run: |
          set -eux
          mkdir -p "$HOME/windows-rs"
          cd "$HOME/windows-rs"
          # Download windows-0.62.2 directly from crates.io instead of using
          # `cargo install cargo-download`. cargo-download v0.1.2 has a transitive
          # dependency on idna_adapter v1.2.2, which requires edition2024 (stabilized
          # in Rust 1.85.0). Cargo 1.83.0 cannot parse its manifest and fails with
          # "feature `edition2024` is required". .crate files are standard tar+gzip
          # archives that extract to a directory named {crate}-{version}/.
          # Firefox 150 requires windows = 0.62.2 (see build/rust/windows/Cargo.toml).
          # SHA256 pinned to the official crates.io cksum from
          # https://crates.io/api/v1/crates/windows/0.62.2 (immutable per
          # crates.io publish policy). Any divergence aborts the build before
          # MOZ_WINDOWS_RS_DIR is exported, preventing a tampered crate from
          # entering the Firefox build tree.
          WINDOWS_RS_SHA256="527fadee13e0c05939a6a05d5bd6eec6cd2e3dbd648b9f8e447c6518133d8580"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://static.crates.io/crates/windows/windows-0.62.2.crate" \
            -o windows-0.62.2.crate
          echo "$WINDOWS_RS_SHA256  windows-0.62.2.crate" | sha256sum -c -
          tar -xzf windows-0.62.2.crate
          rm windows-0.62.2.crate
          echo "MOZ_WINDOWS_RS_DIR=$HOME/windows-rs/windows-0.62.2" >> "$GITHUB_ENV"

      - name: Set up Windows shader compiler
        if: matrix.target == 'windows'
        run: |
          set -eux
          FXC2_URL="https://mirror.msys2.org/mingw/mingw64/mingw-w64-x86_64-fxc2-r19.807d26f-1-any.pkg.tar.zst"
          FXC2_SHA256="d6f5edf6cf73ced93cb515921a11f032cd3aa8276a7270cd97b12059898ab75c"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL --retry 5 --retry-all-errors "$FXC2_URL" -o "$tmpdir/fxc2.pkg.tar.zst"
          echo "$FXC2_SHA256  $tmpdir/fxc2.pkg.tar.zst" | sha256sum -c -
          tar -C "$tmpdir" -xf "$tmpdir/fxc2.pkg.tar.zst" mingw64/bin/fxc.exe
          sudo install -m 0755 "$tmpdir/mingw64/bin/fxc.exe" /usr/local/bin/fxc2.exe
          # fxc2.cpp calls LoadLibrary() with an absolute path built from its own exe
          # directory, so d3dcompiler_47.dll MUST sit next to fxc2.exe. The msys2 fxc2
          # package does not ship the DLL, so we reuse wine's bundled copy.
          # The error message from fxc2 goes to stdout, which genshaders.py captures
          # via subprocess.check_output and discards on failure -- so a missing DLL
          # surfaces only as "non-zero exit status 1" with no diagnostic in the log.
          WINE_D3DCOMPILER=""
          for candidate in \
              /usr/lib/x86_64-linux-gnu/wine/x86_64-windows/d3dcompiler_47.dll \
              /usr/lib/wine/x86_64-windows/d3dcompiler_47.dll \
              /usr/lib64/wine/x86_64-windows/d3dcompiler_47.dll; do
            if [ -f "$candidate" ]; then
              WINE_D3DCOMPILER="$candidate"
              break
            fi
          done
          if [ -z "$WINE_D3DCOMPILER" ]; then
            echo "d3dcompiler_47.dll not found in wine install paths"
            dpkg -L libwine 2>/dev/null | grep -i d3dcompiler || true
            exit 1
          fi
          sudo install -m 0644 "$WINE_D3DCOMPILER" /usr/local/bin/d3dcompiler_47.dll
          # On Ubuntu 24.04, the wine64 binary is shipped at /usr/lib/wine/wine64
          # (not in PATH). Prefer it over /usr/bin/wine, which is the wine-launcher
          # wrapper that pulls in wine32 (unavailable on GitHub Actions runners).
          if command -v wine64 >/dev/null 2>&1; then
            WINE_BIN="$(command -v wine64)"
          elif [ -x /usr/lib/wine/wine64 ]; then
            WINE_BIN="/usr/lib/wine/wine64"
          elif command -v wine >/dev/null 2>&1; then
            WINE_BIN="$(command -v wine)"
          else
            echo "wine executable not found"
            exit 1
          fi
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine64
          sudo ln -sf "$WINE_BIN" /usr/local/bin/wine
          # Override /usr/bin/wine to use wine64 (wine32 unavailable on Ubuntu 24.04 runners).
          # Skip when WINE_BIN is /usr/bin/wine itself, otherwise the symlink would loop on itself.
          if [ "$WINE_BIN" != "/usr/bin/wine" ]; then
            sudo ln -sf "$WINE_BIN" /usr/bin/wine
          fi
          # Pre-initialize a 64-bit wine prefix to avoid wine32 init errors during build
          WINEARCH=win64 WINEPREFIX="$HOME/.wine64" WINEDEBUG=-all "$WINE_BIN" wineboot --init 2>/dev/null || true
          # Install the wine-fxc-wrapper from a checked-in script file. We used
          # to inline this via a here-document, but YAML's block-scalar handling
          # made the resulting script fragile (and surfaces obscure failures
          # like ENOEXEC on the shebang line). Reading from a known-good file
          # avoids any indentation/escaping surprises.
          sudo install -m 0755 "$GITHUB_WORKSPACE/scripts/wine-fxc-wrapper.sh" /usr/local/bin/wine-fxc-wrapper
          # Despite setting WINE=/usr/local/bin/wine-fxc-wrapper in the env and
          # the mozconfig, mach's check_prog('WINE', ...) in Firefox 135 was
          # observed picking up /usr/lib/wine/wine64 directly and baking that
          # raw path into the generated makefiles (see build log:
          # "checking for wine... /usr/lib/wine/wine64"). genshaders.py then
          # invokes that raw wine, the .hlsl source paths stay forward-slash,
          # and d3dcompiler's strrchr('\\') include-resolution fails with E4002
          # ("Failed to open BlendShaderConstants.h"). To make the wrapper
          # unbypassable, we move the real wine64 binary aside and install the
          # wrapper AT the path mach hardcodes. The wrapper itself prefers
          # *.real candidates and skips self-references, so the resulting chain
          # is: caller -> /usr/lib/wine/wine64 (wrapper) -> /usr/lib/wine/wine64.real (real).
          for real_wine in /usr/lib/wine/wine64 /usr/lib/x86_64-linux-gnu/wine/wine64; do
            if [ -f "$real_wine" ] && [ ! -L "$real_wine" ]; then
              # Only move if it's a real binary and we haven't already moved it.
              if [ ! -e "${real_wine}.real" ]; then
                sudo mv "$real_wine" "${real_wine}.real"
              else
                sudo rm -f "$real_wine"
              fi
              sudo install -m 0755 "$GITHUB_WORKSPACE/scripts/wine-fxc-wrapper.sh" "$real_wine"
            fi
          done
          # Also drop d3dcompiler_47.dll into the wine prefix's system32 so
          # LoadLibrary() can resolve it via DLL search order even when wine
          # falls back from the exe-adjacent path lookup.
          mkdir -p "$HOME/.wine64/drive_c/windows/system32"
          install -m 0644 "$WINE_D3DCOMPILER" "$HOME/.wine64/drive_c/windows/system32/d3dcompiler_47.dll"
          echo "WINE=/usr/local/bin/wine-fxc-wrapper" >> "$GITHUB_ENV"
          echo "WINEARCH=win64" >> "$GITHUB_ENV"
          echo "WINEPREFIX=$HOME/.wine64" >> "$GITHUB_ENV"
          echo "WINEDEBUG=-all" >> "$GITHUB_ENV"
          command -v fxc2.exe
          "$WINE_BIN" --version
          /usr/local/bin/wine-fxc-wrapper --version
          # Sanity-check the wrapper is invocable through execve (not just via
          # bash fallback). Python's subprocess uses execve directly, so a
          # broken shebang would cause the build to silently fall back to a
          # raw wine binary and re-introduce the HLSL path bug.
          python3 -c "import subprocess; print(subprocess.check_output(['/usr/local/bin/wine-fxc-wrapper', '--version']).decode().strip())"

      - name: Fetch source
        run: |
          make fetch

      - name: Setup source
        run: |
          make setup-minimal
          mkdir -p dist

      - name: Bootstrap macOS cross toolchain (Mozilla clang + SDK)
        # Mirror upstream camoufox: instead of building osxcross + a third-party
        # macOS SDK (which mismatched host clang-18 against the macOS 26 SDK's
        # `visionOS` availability tokens), use Mozilla's own toolchain. `mach
        # bootstrap` provisions the host build environment; the subsequent
        # `mach build` (with --enable-bootstrap from assets/base.mozconfig's
        # macos branch) auto-fetches Mozilla's cross clang for the
        # --target=*-apple-darwin triple. The macOS SDK is supplied separately
        # by the next step (Mozilla's SDK artifact is Apple-licensed/private and
        # 403s for external builds). Runs on the freshly extracted, not-yet-
        # patched tree — bootstrap is independent of the patch graph.
        if: matrix.target == 'macos'
        run: |
          set -eux
          src_dir="$(ls -d camoufox-*/ | head -n1)"
          cd "$src_dir"
          MOZBUILD_STATE_PATH="$HOME/.mozbuild" ./mach --no-interactive bootstrap --application-choice=browser

      - name: Fetch macOS SDK (public mirror)
        # Mozilla's bootstrapped macOS SDK is private (the in-build auto-fetch
        # returns HTTP 403 externally). Supply the public MacOSX26.1 SDK and
        # point --with-macos-sdk at it (assets/macos.mozconfig). FF150 wants
        # >= 26.2; core/macos-sdk-min-version.patch lowers that to 26.1 because
        # the joseluisq mirror tops out at 26.1. SHA-pinned to the value the
        # release also publishes; a corrupted/swapped tarball would otherwise
        # surface as confusing clang/link errors deep in the cross build.
        if: matrix.target == 'macos'
        env:
          MACOS_SDK_VERSION: "26.1"
          MACOS_SDK_SHA256: "beee7212d265a6d2867d0236cc069314b38d5fb3486a6515734e76fa210c784c"
        run: |
          set -eux
          mkdir -p "$HOME/.mozbuild"
          url="https://github.com/joseluisq/macosx-sdks/releases/download/${MACOS_SDK_VERSION}/MacOSX${MACOS_SDK_VERSION}.sdk.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors "$url" -o /tmp/macsdk.tar.xz
          echo "${MACOS_SDK_SHA256}  /tmp/macsdk.tar.xz" | sha256sum -c -
          tar -xJf /tmp/macsdk.tar.xz -C "$HOME/.mozbuild"
          sdk_dir="$HOME/.mozbuild/MacOSX${MACOS_SDK_VERSION}.sdk"
          test -d "$sdk_dir"
          echo "MACOS_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"

      - name: Fetch Windows App SDK redistributable
        # FF150 requires the Windows App SDK for every windows compile build
        # (toolkit/moz.configure: FatalCheckError "Windows App SDK dir not
        # present!"). It is normally provided by --enable-bootstrap; the MinGW
        # cross-build uses local toolchains (--disable-bootstrap), so fetch the
        # public redistributable and extract exactly the DLLs Firefox needs,
        # mirroring taskcluster/scripts/misc/build-WindowsAppSDK.sh. URL + SHA
        # are the ones pinned in FF150's taskcluster/kinds/fetch/toolchains.yml.
        # (dxcompiler.dll is NOT needed: with no MSVC Windows SDK present its
        # configure check just disables WebGPU's DXC path with a warning.)
        if: matrix.target == 'windows'
        env:
          REDIST_URL: "https://aka.ms/windowsappsdk/1.8/1.8.251106002/Microsoft.WindowsAppRuntime.Redist.1.8.zip"
          REDIST_SHA256: "57748c37e2b0ce381518bbe7ac72e015c150771a343af89f9f0bd95aa5e9bbc0"
          SHORT_VERSION: "1.8"
        run: |
          set -eux
          case "${{ matrix.arch }}" in
            x86_64) arch_suffix=x64 ;;
            i686)   arch_suffix=x86 ;;
            arm64)  arch_suffix=arm64 ;;
            *) echo "unknown arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          # Ensure CA trust store is current — older runner images can miss the
          # Microsoft/DigiCert intermediate cert used by aka.ms, which causes
          # curl (60) SSL failures. update-ca-certificates is idempotent and
          # fast; we also spread the 5 retries over 50 s for transient blips.
          sudo apt-get install -y --no-install-recommends ca-certificates -qq
          sudo update-ca-certificates
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 "$REDIST_URL" -o /tmp/winappsdk.zip
          echo "${REDIST_SHA256}  /tmp/winappsdk.zip" | sha256sum -c -
          work=/tmp/winappsdk && rm -rf "$work" && mkdir -p "$work"
          unzip -q /tmp/winappsdk.zip "MSIX/win10-${arch_suffix}/*" -d "$work"
          msix="$work/MSIX/win10-${arch_suffix}/Microsoft.WindowsAppRuntime.${SHORT_VERSION}.msix"
          unzip -q "$msix" -d "$work/extracted"
          dest="$HOME/winappsdk-dlls"
          rm -rf "$dest" && mkdir -p "$dest"
          for dll in CoreMessagingXP.dll marshal.dll Microsoft.InputStateManager.dll \
                     Microsoft.Internal.FrameworkUdk.dll Microsoft.UI.Composition.OSSupport.dll \
                     Microsoft.UI.Input.dll Microsoft.UI.Windowing.Core.dll Microsoft.UI.Windowing.dll; do
            cp "$work/extracted/$dll" "$dest/"
          done
          ls -la "$dest"
          echo "MOZ_WINDOWS_APP_SDK_DIR=$dest" >> "$GITHUB_ENV"

      - name: Patch Maybe.h for freestanding cross-compile
        # mfbt/Maybe.h does `#include <ostream>` unguarded and defines a
        # `friend std::ostream& operator<<(...)` inside the Maybe<T> class.
        # Under -ffreestanding (winlauncher freestanding sub-library), the
        # include chain <ostream> -> <ios> -> <iosfwd> -> allocator<_CharT>
        # fails because <memory> is unavailable. Mozilla's own MSVC build
        # is unaffected; Camoufox cross-build (clang+MinGW) hits it.
        # Verified 2026-05-23: still unfixed in FIREFOX_150_0_2_RELEASE.
        # Hard-fails if either edit point is missing (defends against an
        # upstream rename).
        if: matrix.target == 'windows'
        run: |
          set -eux
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          candidates = list(Path(".").glob("camoufox-*/mfbt/Maybe.h"))
          if not candidates:
              sys.exit("ERROR: no camoufox-*/mfbt/Maybe.h found after make setup-minimal")
          maybe_h = candidates[0]
          print(f"Patching: {maybe_h}")
          text = maybe_h.read_text()

          # (1) Guard #include <ostream>
          needle = "#include <ostream>"
          if needle not in text:
              sys.exit(f"ERROR: '{needle}' not found in {maybe_h} (upstream may have fixed this — drop this step)")
          guarded_include = "#if __STDC_HOSTED__\n#  include <ostream>\n#endif"
          text = text.replace(needle, guarded_include, 1)

          # (2) Guard the friend std::ostream& operator<< block.
          # Signature spans multiple lines: capture from `friend ` through
          # the opening `{`, then walk brace depth forward to the matching
          # close. [^)] is newline-permissive so the multiline arg list is
          # absorbed cleanly.
          sig_re = re.compile(
              r"(\s*friend\s+std::ostream&\s+operator<<\s*\(\s*std::ostream&[^)]*\)[^{]*\{)"
          )
          m = sig_re.search(text)
          if not m:
              sys.exit(f"ERROR: friend std::ostream& operator<< signature not found in {maybe_h}")
          start = m.start()
          depth = 1
          i = m.end()
          while i < len(text) and depth > 0:
              c = text[i]
              if c == '{':
                  depth += 1
              elif c == '}':
                  depth -= 1
              i += 1
          if depth != 0:
              sys.exit("ERROR: brace match failed walking operator<< body")
          end = i  # one past the closing brace

          block = text[start:end]
          guarded = "\n#if __STDC_HOSTED__" + block + "\n#endif\n"
          text = text[:start] + guarded + text[end:]

          maybe_h.write_text(text)
          print(f"OK: guarded <ostream> include and operator<< in {maybe_h}")
          PY

      - name: Wrap STL wrappers in extern "C++" for MinGW windows.h
        # Mozilla generates an STL wrapper for every wrapped header
        # (obj/dist/stl_wrappers/<hdr>) from a template. config/moz.build picks
        # the template by OS_TARGET: WINNT -> msvc-stl-wrapper.template.h (even
        # under a clang/MinGW cross-build), else gcc-stl-wrapper.template.h. The
        # MSVC template's body includes <type_traits> + mozilla/mozalloc.h; the
        # GCC template's ends with mozilla/throw_gcc.h, which also pulls in
        # <type_traits>. MinGW's <windows.h> -> winnt.h opens an `extern "C" {`
        # block (winnt.h:1656) and, in C++ mode, includes <cstdlib> while it is
        # still open; the cstdlib wrapper then drags <type_traits> into C
        # linkage, so clang errors "templates must have C++ linkage" /
        # "no template named 'integral_constant'" (hit by ipc/mscom/
        # COMWrappers.cpp and mozglue/baseprofiler). Mozilla builds Windows with
        # real MSVC, whose windows.h does not do this, so upstream never trips
        # it -- consistent with upstream camoufox shipping no FF150 Windows build.
        #
        # Fix: wrap each template's include body in `extern "C++" { ... }`, which
        # restores C++ linkage even when the generated wrapper is pulled inside
        # an extern "C" block, and is a no-op for normal inclusion. Anchor on the
        # `#include_next <...>` line (present in both templates) and the header-
        # guard endif. Patch BOTH templates (the Windows build uses the msvc one,
        # but patching both is harmless and future-proof). Hard-fails if neither
        # template is found or an anchor is missing.
        if: matrix.target == 'windows'
        run: |
          set -eux
          mapfile -t tmpls < <(find . -path '*camoufox-*/config/*-stl-wrapper.template.h' 2>/dev/null)
          if [ "${#tmpls[@]}" -eq 0 ]; then
            echo "ERROR: no *-stl-wrapper.template.h found after setup-minimal"; exit 1
          fi
          for f in "${tmpls[@]}"; do
            if grep -q '^extern "C++" {' "$f"; then
              echo "NOTE: $f already wrapped; skipping."
              continue
            fi
            grep -q '^#include_next <' "$f" \
              || { echo "ERROR: include_next anchor missing in $f"; exit 1; }
            grep -q '^#endif  // if mozilla_' "$f" \
              || { echo "ERROR: header-guard endif anchor missing in $f"; exit 1; }
            sed -i \
              -e 's@^#include_next <@extern "C++" {\n#include_next <@' \
              -e 's@^#endif  // if mozilla_@}\n#endif  // if mozilla_@' \
              "$f"
            echo "wrapped STL wrapper body in extern \"C++\": $f"
          done

      - name: Patch MinGW-specific Firefox source gaps
        # Firefox's MinGW code paths are not exercised by Mozilla CI (which
        # builds Windows with MSVC), so a few are subtly broken for the
        # clang/MinGW cross-build:
        #
        #   1. mfbt/FStream.h: the `__MINGW32__ && __GLIBCXX__` branch uses
        #      char16ptr_t (for its _wopen-based IFStream/OFStream) but only
        #      includes mozilla/Char16.h in the non-MinGW #else branch, so
        #      char16ptr_t is undeclared -> "unknown type name 'char16ptr_t'"
        #      and a cascade of _wopen / IFStream errors (hit by
        #      mozglue/misc/PreXULSkeletonUI.cpp).
        #
        #   2. mozglue/misc/PreXULSkeletonUI.cpp uses DWMWA_USE_IMMERSIVE_DARK_MODE
        #      (DWMWINDOWATTRIBUTE value 20, Windows 10 20H1+). Ubuntu's MinGW
        #      dwmapi.h ships DWMWA_USE_IMMERSIVE_DARK_MODE_BEFORE_20H1 but not
        #      the final constant -> "use of undeclared identifier".
        #
        # Both are minimal, self-contained source fixes. Hard-fail if an anchor
        # is missing (defends against an upstream rename/refactor).
        if: matrix.target == 'windows'
        run: |
          set -eux
          src_dir="$(ls -d camoufox-*/ | head -n1)"

          # (1) Add the missing Char16.h include to FStream.h's MinGW branch.
          # The MinGW branch uses 2-space cpp indent (#  include); the existing
          # Char16.h include in the #else branch uses 4-space (#    include), so
          # the 2-space guard below distinguishes "already patched" from it.
          fstream="${src_dir}mfbt/FStream.h"
          test -f "$fstream" || { echo "ERROR: $fstream not found"; exit 1; }
          if grep -q '^#  include "mozilla/Char16.h"' "$fstream"; then
            echo "NOTE: Char16.h already in FStream.h MinGW branch; skipping."
          else
            grep -q '^#  include <ext/stdio_filebuf.h>' "$fstream" \
              || { echo "ERROR: stdio_filebuf anchor missing in $fstream"; exit 1; }
            sed -i 's@^#  include <ext/stdio_filebuf.h>@#  include "mozilla/Char16.h"\n#  include <ext/stdio_filebuf.h>@' "$fstream"
            echo "added mozilla/Char16.h to FStream.h MinGW branch"
          fi

          # (2) Define DWMWA_USE_IMMERSIVE_DARK_MODE if the MinGW dwmapi.h lacks it.
          prexul="${src_dir}mozglue/misc/PreXULSkeletonUI.cpp"
          test -f "$prexul" || { echo "ERROR: $prexul not found"; exit 1; }
          grep -q '^#include <dwmapi.h>' "$prexul" \
            || { echo "ERROR: dwmapi.h include anchor missing in $prexul"; exit 1; }
          if grep -q 'define DWMWA_USE_IMMERSIVE_DARK_MODE ' "$prexul"; then
            echo "NOTE: DWMWA fallback already present; skipping."
          else
            sed -i 's@^#include <dwmapi.h>@#include <dwmapi.h>\n#ifndef DWMWA_USE_IMMERSIVE_DARK_MODE\n#  define DWMWA_USE_IMMERSIVE_DARK_MODE 20\n#endif@' "$prexul"
            echo "added DWMWA_USE_IMMERSIVE_DARK_MODE fallback to PreXULSkeletonUI.cpp"
          fi

          # (3) CacheNtDllThunk.cpp defines CacheNtDllThunk()/GetCachedNtDllThunk()
          # as `static`, but its own header declares them MFBT_API (non-static,
          # dllexport when building mozglue). clang rejects "static declaration
          # follows non-static declaration". They are consumed externally (the
          # header exists for that), so the `static` is the anomaly -- drop it to
          # match the header. (The sCachedNtDllThunk static *variable* is left
          # untouched: the anchors below match only the two function defs.)
          cache="${src_dir}toolkit/xre/dllservices/mozglue/CacheNtDllThunk.cpp"
          test -f "$cache" || { echo "ERROR: $cache not found"; exit 1; }
          grep -q '^static void CacheNtDllThunk()' "$cache" \
            || { echo "ERROR: CacheNtDllThunk def anchor missing in $cache"; exit 1; }
          sed -i \
            -e 's@^static void CacheNtDllThunk()@void CacheNtDllThunk()@' \
            -e 's@^static Buffer<IMAGE_THUNK_DATA>\* GetCachedNtDllThunk()@Buffer<IMAGE_THUNK_DATA>* GetCachedNtDllThunk()@' \
            "$cache"
          echo "removed static from CacheNtDllThunk.cpp exported defs"

          # (4) WindowsStackWalkInitialization.cpp uses the MSVC-only integer
          # suffix `9i64`; clang/MinGW only accepts LL. Rewrite <digit>i64 -> LL.
          wsw="${src_dir}toolkit/xre/dllservices/mozglue/WindowsStackWalkInitialization.cpp"
          test -f "$wsw" || { echo "ERROR: $wsw not found"; exit 1; }
          grep -q '[0-9]i64' "$wsw" \
            || { echo "ERROR: i64 suffix anchor missing in $wsw"; exit 1; }
          sed -i 's@\([0-9]\)i64@\1LL@g' "$wsw"
          echo "rewrote i64 integer suffix(es) to LL in WindowsStackWalkInitialization.cpp"

          # (5) security/sandbox chromium-shim win_util.h uses uint32_t/int32_t
          # without including <cstdint> (it relies on a transitive include that
          # the MSVC header set provides but MinGW's does not). Add the include.
          winutil="${src_dir}security/sandbox/chromium-shim/base/win/win_util.h"
          test -f "$winutil" || { echo "ERROR: $winutil not found"; exit 1; }
          if grep -q '^#include <cstdint>' "$winutil"; then
            echo "NOTE: <cstdint> already in win_util.h; skipping."
          else
            grep -q '^#include <minwindef.h>' "$winutil" \
              || { echo "ERROR: minwindef.h anchor missing in $winutil"; exit 1; }
            sed -i 's@^#include <minwindef.h>@#include <cstdint>\n#include <minwindef.h>@' "$winutil"
            echo "added <cstdint> to win_util.h"
          fi

          # (6) third_party/llama.cpp ggml-cpu-c.c gates a Win11 thread-power-
          # throttling hint behind `#if _WIN32_WINNT >= 0x0602`, but the
          # THREAD_POWER_THROTTLING_STATE struct + its CURRENT_VERSION /
          # EXECUTION_SPEED constants only exist in MinGW's processthreadsapi.h
          # under _WIN32_WINNT >= 0x0A00, so the block fails to compile with
          # "use of undeclared identifier 'THREAD_POWER_THROTTLING_STATE'".
          # The block is a pure perf hint (tells Win11 not to park the inference
          # threads); skipping it has no functional effect for camoufox, so we
          # neuter just that one guard to `#if 0`. There is exactly one such
          # guard in the file (asserted below), so this cannot over-match.
          ggml="${src_dir}third_party/llama.cpp/ggml/src/ggml-cpu/ggml-cpu-c.c"
          test -f "$ggml" || { echo "ERROR: $ggml not found"; exit 1; }
          n_guard="$(grep -cE '^[[:space:]]*#if _WIN32_WINNT >= 0x0602' "$ggml")"
          if [ "$n_guard" = "0" ]; then
            if grep -q 'camoufox: MinGW lacks THREAD_POWER_THROTTLING' "$ggml"; then
              echo "NOTE: throttling guard already neutered; skipping."
            else
              echo "ERROR: _WIN32_WINNT>=0x0602 anchor missing in $ggml"; exit 1
            fi
          elif [ "$n_guard" = "1" ]; then
            sed -i 's@^\([[:space:]]*\)#if _WIN32_WINNT >= 0x0602@\1#if 0  // camoufox: MinGW lacks THREAD_POWER_THROTTLING_STATE@' "$ggml"
            echo "neutered Win11 thread-power-throttling block in ggml-cpu-c.c"
          else
            echo "ERROR: expected exactly 1 _WIN32_WINNT>=0x0602 guard in $ggml, found $n_guard"; exit 1
          fi

          # (7) security/sandbox chromium thread_local_storage.cc calls memset()
          # but includes neither <cstring> nor <string.h> -- it relies on the
          # MSVC header set pulling string.h transitively. clang/MinGW does not,
          # so memset is undeclared ("did you mean 'wmemset'?"). Add <cstring>.
          tls="${src_dir}security/sandbox/chromium/base/threading/thread_local_storage.cc"
          test -f "$tls" || { echo "ERROR: $tls not found"; exit 1; }
          if grep -q '^#include <cstring>' "$tls"; then
            echo "NOTE: <cstring> already in thread_local_storage.cc; skipping."
          else
            grep -q '^#include <algorithm>' "$tls" \
              || { echo "ERROR: <algorithm> anchor missing in $tls"; exit 1; }
            sed -i 's@^#include <algorithm>@#include <algorithm>\n#include <cstring>@' "$tls"
            echo "added <cstring> to thread_local_storage.cc"
          fi

          # (8) third_party/llama.cpp llama-arch.cpp calls strcmp() without
          # <cstring>/<string.h> (same MSVC-transitive-include assumption as the
          # thread_local_storage / memset case) -> "use of undeclared identifier
          # 'strcmp'". Add <cstring> after its first system include.
          larch="${src_dir}third_party/llama.cpp/src/llama-arch.cpp"
          test -f "$larch" || { echo "ERROR: $larch not found"; exit 1; }
          if grep -q '^#include <cstring>' "$larch"; then
            echo "NOTE: <cstring> already in llama-arch.cpp; skipping."
          else
            grep -q '^#include <map>' "$larch" \
              || { echo "ERROR: <map> anchor missing in $larch"; exit 1; }
            sed -i 's@^#include <map>@#include <cstring>\n#include <map>@' "$larch"
            echo "added <cstring> to llama-arch.cpp"
          fi

          # (9) security/sandbox chromium process_mitigations.cc, two MinGW gaps:
          #   (a) It probes user-mode CET (Hardware-enforced Stack Protection)
          #       via decltype(&IsUserCetAvailableInEnvironment) + the constant
          #       USER_CET_ENVIRONMENT_WIN32_PROCESS. Both only exist in MinGW's
          #       headers under a very recent Windows SDK level, so on Ubuntu's
          #       MinGW they are undeclared. The function is GetProcAddress-loaded
          #       at runtime (never linked), so a bare extern "C" prototype + the
          #       constant is all the compiler needs. Guard on the constant: if a
          #       newer SDK defines it, the whole CET API is present -> skip shim.
          #   (b) MSVC-only integer suffix `ui64` (e.g. 0x...ui64) -> clang/MinGW
          #       wants ULL. Rewrite <hexdigit>ui64 -> <hexdigit>ULL.
          pmit="${src_dir}security/sandbox/chromium/sandbox/win/src/process_mitigations.cc"
          test -f "$pmit" || { echo "ERROR: $pmit not found"; exit 1; }
          if grep -q 'camoufox: CET shim' "$pmit"; then
            echo "NOTE: CET shim already present; skipping."
          else
            grep -q '^bool IsUserCetWin32Available() {' "$pmit" \
              || { echo "ERROR: IsUserCetWin32Available anchor missing in $pmit"; exit 1; }
            sed -i 's@^bool IsUserCetWin32Available() {@#ifndef USER_CET_ENVIRONMENT_WIN32_PROCESS  // camoufox: CET shim\n#  define USER_CET_ENVIRONMENT_WIN32_PROCESS 0x00000000\nextern "C" BOOL WINAPI IsUserCetAvailableInEnvironment(DWORD UserCetEnvironment);\n#endif\nbool IsUserCetWin32Available() {@' "$pmit"
            echo "injected CET shim into process_mitigations.cc"
          fi
          if grep -qE '[0-9a-fA-F]ui64' "$pmit"; then
            sed -i -E 's@([0-9a-fA-F])ui64@\1ULL@g' "$pmit"
            echo "rewrote ui64 integer suffix(es) to ULL in process_mitigations.cc"
          else
            echo "NOTE: no ui64 suffix left in process_mitigations.cc; skipping."
          fi

          # (10) gfx/angle: the MinGW WinRT headers (windows.ui.composition.h)
          # forward-declare enums, which plain clang rejects ("ISO C++ forbids
          # forward references to 'enum' types"). Mozilla builds ANGLE with
          # clang-cl (Microsoft mode) where this is legal. Re-enable just the
          # Microsoft *language extensions* (additive/permissive; does NOT define
          # _MSC_VER or change ABI/mangling) for the ANGLE subtree on the clang
          # MinGW cross-build, scoped via its shared moz.build.common so only
          # ANGLE is affected, not the whole tree.
          anglecommon="${src_dir}gfx/angle/moz.build.common"
          test -f "$anglecommon" || { echo "ERROR: $anglecommon not found"; exit 1; }
          if grep -q 'fms-extensions' "$anglecommon"; then
            echo "NOTE: -fms-extensions already in angle moz.build.common; skipping."
          else
            grep -q "^    DEFINES\['ANGLE_IS_WIN'\] = True" "$anglecommon" \
              || { echo "ERROR: ANGLE_IS_WIN anchor missing in $anglecommon"; exit 1; }
            sed -i "s@^    DEFINES\['ANGLE_IS_WIN'\] = True@    DEFINES['ANGLE_IS_WIN'] = True\n    if CONFIG['CC_TYPE'] == 'clang':\n        CXXFLAGS += ['-fms-extensions']@" "$anglecommon"
            echo "added -fms-extensions for clang to angle moz.build.common"
          fi

          # (11) security/sandbox chromium startup_information_helper.cc uses the
          # process-creation attribute PROC_THREAD_ATTRIBUTE_COMPONENT_FILTER
          # (Win10 2004+ Code Integrity Guard). Ubuntu's MinGW processthreadsapi.h
          # lacks this macro (it has the older ProcThreadAttributeValue helper and
          # the base PROC_THREAD_ATTRIBUTE_* bits, but not the ComponentFilter
          # value 26). Define it via the existing helper using the literal
          # attribute number 26 (== ProcThreadAttributeComponentFilter), guarded
          # so a newer SDK that already provides it wins.
          sih="${src_dir}security/sandbox/chromium/sandbox/win/src/startup_information_helper.cc"
          test -f "$sih" || { echo "ERROR: $sih not found"; exit 1; }
          if grep -q 'camoufox: PROC_THREAD_ATTRIBUTE_COMPONENT_FILTER fallback' "$sih"; then
            echo "NOTE: COMPONENT_FILTER fallback already present; skipping."
          else
            grep -q '^#include <windows.h>' "$sih" \
              || { echo "ERROR: <windows.h> anchor missing in $sih"; exit 1; }
            sed -i 's@^#include <windows.h>@#include <windows.h>\n#ifndef PROC_THREAD_ATTRIBUTE_COMPONENT_FILTER  // camoufox: PROC_THREAD_ATTRIBUTE_COMPONENT_FILTER fallback\n#  define PROC_THREAD_ATTRIBUTE_COMPONENT_FILTER ProcThreadAttributeValue(26, FALSE, TRUE, FALSE)\n#endif@' "$sih"
            echo "added PROC_THREAD_ATTRIBUTE_COMPONENT_FILTER fallback to startup_information_helper.cc"
          fi

          # (12) gfx/wr webrender texture_cache.rs declares
          #   impl BudgetType { pub const COUNT: usize = 7;
          #                     pub const VALUES: [BudgetType; BudgetType::COUNT] = [...]; }
          # cbindgen emits this associated-const array but mistranslates the
          # array-size expression `BudgetType::COUNT` into a bare, undeclared
          # `COUNT` (it strips the `BudgetType::` qualifier without re-prefixing
          # to `BudgetType_COUNT`), producing
          #   constexpr static const BudgetType BudgetType_VALUES[COUNT] = {...};
          # -> "use of undeclared identifier 'COUNT'" when the generated header is
          # compiled (hit via browser/components/about/AboutRedirector.cpp). Fix
          # at the source: use the literal length in the array *sizes* so cbindgen
          # emits a valid `[7]`. Value-context uses (e.g. LRUCache::new(
          # BudgetType::COUNT), which end in `)` not `]`) are deliberately left
          # untouched. 7 == BudgetType::COUNT, so this is behaviourally identical.
          texcache="${src_dir}gfx/wr/webrender/src/texture_cache.rs"
          test -f "$texcache" || { echo "ERROR: $texcache not found"; exit 1; }
          if grep -qE '\[[^]]*BudgetType::COUNT\]' "$texcache"; then
            sed -i -E 's@(\[[^]]*); BudgetType::COUNT\]@\1; 7]@g' "$texcache"
            echo "rewrote BudgetType::COUNT array sizes to literal 7 in texture_cache.rs"
            grep -nE '\[[^]]*BudgetType::COUNT\]' "$texcache" && { echo "ERROR: array-size BudgetType::COUNT still present"; exit 1; } || true
          else
            echo "NOTE: no BudgetType::COUNT array sizes in texture_cache.rs; skipping."
          fi

          # (13) mfbt/ResultExtensions.h and dom/quota/ResultExtensions.h route
          # MOZ_TO_RESULT_INVOKE_MEMBER_TYPED / QM_TO_RESULT_INVOKE_MEMBER_TYPED
          # through ::std::mem_fn(&Iface::Method). On 32-bit Windows, XPCOM methods
          # are virtual __stdcall (NS_IMETHOD), and libstdc++'s std::_Mem_fn_traits
          # has NO calling-convention specializations (only cv/ref qualifiers) --
          # unlike MSVC's STL -- so std::mem_fn fails with "implicit instantiation
          # of undefined template 'std::_Mem_fn_traits<nsresult (Iface::*)(...)
          # __stdcall>'" (hit via dom/quota/QuotaCommon.h on the i686 leg; x86_64 is
          # unaffected because __stdcall is a no-op there). Mozilla already special-
          # cased the non-mem_fn ToResultInvokeMember path for i686 (see the
          # `#if defined(XP_WIN) && !defined(_WIN64)` __stdcall overloads in this
          # file) but left the mem_fn TYPED path, since their own i686 Windows CI
          # uses MSVC. std::invoke is calling-convention agnostic -- it deduces from
          # the actual call expression and never instantiates _Mem_fn_traits -- so
          # inject a small SFINAE-friendly std::invoke call wrapper
          # (mozilla::detail::MemFnInvoker) and point both macros at it. It is a
          # drop-in for std::mem_fn (std::mem_fn(p)(o,a...) == std::invoke(p,o,a...))
          # and harmless on every other target, so apply on both Windows arches.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          helper = '\n'.join([
              'namespace detail {',
              '// camoufox: std::mem_fn has no calling-convention specializations in',
              '// libstdc++ (std::_Mem_fn_traits covers only cv/ref qualifiers), so an',
              '// XPCOM __stdcall member pointer (NS_IMETHOD on 32-bit Windows) makes it',
              '// an undefined template. std::invoke is convention-agnostic, so wrap the',
              '// pointer in a SFINAE-friendly std::invoke call wrapper instead.',
              'template <typename MemPtr>',
              'auto MemFnInvoker(MemPtr aMemPtr) {',
              '  return [aMemPtr](auto&& aSelf, auto&&... aArgs)',
              '             -> decltype(::std::invoke(',
              '                 aMemPtr, std::forward<decltype(aSelf)>(aSelf),',
              '                 std::forward<decltype(aArgs)>(aArgs)...)) {',
              '    return ::std::invoke(aMemPtr, std::forward<decltype(aSelf)>(aSelf),',
              '                         std::forward<decltype(aArgs)>(aArgs)...);',
              '  };',
              '}',
              '}  // namespace detail',
              '',
              '',
          ])
          anchor = '// Macro version of ToResultInvokeMember for member functions. The macro has'
          mfbt = os.path.join(src_dir, 'mfbt', 'ResultExtensions.h')
          with open(mfbt, encoding='utf-8') as f:
              s = f.read()
          if 'MemFnInvoker' not in s:
              if anchor not in s:
                  sys.exit('ERROR: macro-comment anchor missing in ' + mfbt)
              s = s.replace(anchor, helper + anchor, 1)
          n1 = s.count('::std::mem_fn(')
          s = s.replace('::std::mem_fn(', '::mozilla::detail::MemFnInvoker(')
          with open(mfbt, 'w', encoding='utf-8') as f:
              f.write(s)
          final = open(mfbt, encoding='utf-8').read()
          if 'MemFnInvoker' not in final or '::std::mem_fn(' in final:
              sys.exit('ERROR: MemFnInvoker swap failed in ' + mfbt)
          qm = os.path.join(src_dir, 'dom', 'quota', 'ResultExtensions.h')
          with open(qm, encoding='utf-8') as f:
              s = f.read()
          n2 = s.count('::std::mem_fn(')
          s = s.replace('::std::mem_fn(', '::mozilla::detail::MemFnInvoker(')
          with open(qm, 'w', encoding='utf-8') as f:
              f.write(s)
          if '::std::mem_fn(' in open(qm, encoding='utf-8').read():
              sys.exit('ERROR: MemFnInvoker swap failed in ' + qm)
          print('MemFnInvoker: injected helper, swapped %d (mfbt) + %d (quota) mem_fn call(s)' % (n1, n2))
          PYEOF

          # (14) dom/media/gmp/rlz/lib/machine_id.h uses std::vector<uint8_t> but
          # includes only <string>/<vector>; MSVC's <vector> transitively drags in
          # <cstdint> while libstdc++'s MinGW <vector> does not, so uint8_t is
          # undeclared ("unknown type name 'uint8_t'; did you mean 'wint_t'?",
          # cascading into GetRawMachineId signature errors in machine_id.cc -- hit
          # on the x86_64 leg, arch-independent). Add the explicit <cstdint>.
          machineid="${src_dir}dom/media/gmp/rlz/lib/machine_id.h"
          test -f "$machineid" || { echo "ERROR: $machineid not found"; exit 1; }
          if grep -q '^#include <cstdint>' "$machineid"; then
            echo "NOTE: <cstdint> already in machine_id.h; skipping."
          else
            grep -q '^#include <vector>' "$machineid" \
              || { echo "ERROR: <vector> anchor missing in $machineid"; exit 1; }
            sed -i 's@^#include <vector>@#include <vector>\n#include <cstdint>@' "$machineid"
            echo "added <cstdint> to machine_id.h"
          fi

          # (15) dom/media/platforms/wmf/WMFDataEncoderUtils.cpp defines
          # ParseH264Parameters() and GetProfile() as `static`, but its header
          # WMFDataEncoderUtils.h declares them non-static (namespace-scope, external
          # linkage) -- and WMFMediaDataEncoder.cpp also calls them, so external is
          # required. clang rejects "static declaration follows non-static
          # declaration" (and then "call to 'GetProfile' is ambiguous"); MSVC merely
          # warns. Same class as (3) CacheNtDllThunk: the `static` is the anomaly,
          # drop it to match the header. Hits both arches.
          wmfenc="${src_dir}dom/media/platforms/wmf/WMFDataEncoderUtils.cpp"
          test -f "$wmfenc" || { echo "ERROR: $wmfenc not found"; exit 1; }
          grep -q '^static already_AddRefed<MediaByteBuffer> ParseH264Parameters(' "$wmfenc" \
            || { echo "ERROR: ParseH264Parameters static-def anchor missing in $wmfenc"; exit 1; }
          sed -i \
            -e 's@^static already_AddRefed<MediaByteBuffer> ParseH264Parameters(@already_AddRefed<MediaByteBuffer> ParseH264Parameters(@' \
            -e 's@^static uint32_t GetProfile(H264_PROFILE aProfileLevel)@uint32_t GetProfile(H264_PROFILE aProfileLevel)@' \
            "$wmfenc"
          echo "removed static from WMFDataEncoderUtils.cpp ParseH264Parameters/GetProfile defs"

          # (16) dom/media/webrtc/libwebrtc_overrides/.../desktop_capture_types.h
          # does `#ifdef XP_WIN \n typedef int pid_t;` to inject pid_t into the
          # global namespace for Windows -- correct for MSVC (no pid_t). On MinGW
          # two things go wrong: (a) where <sys/types.h> was already pulled in,
          # MinGW's own pid_t (== _pid_t, __int64 on win64) clashes with `int`
          # ("typedef redefinition with different types"); (b) but the typedef is
          # ALSO the sole provider of pid_t for TUs that did NOT pull <sys/types.h>
          # (e.g. tab_capturer.o -> desktop_capturer.h:82 `pid_t pid`). So we cannot
          # just drop it on MinGW (an earlier attempt did, and (b) broke). Instead,
          # on MinGW include <sys/types.h> and define pid_t as MinGW's own _pid_t:
          # a redef to the *identical* type is legal (no clash with (a)), it is
          # always provided (covers (b) and NO_OLDNAMES builds), and it has MinGW's
          # native width. MSVC keeps `typedef int pid_t`.
          dctypes="${src_dir}dom/media/webrtc/libwebrtc_overrides/modules/desktop_capture/desktop_capture_types.h"
          test -f "$dctypes" || { echo "ERROR: $dctypes not found"; exit 1; }
          if grep -q '__MINGW32__' "$dctypes"; then
            echo "NOTE: desktop_capture_types.h pid_t already MinGW-aware; skipping."
          else
            grep -q '^typedef int pid_t;  // matching what used to be in' "$dctypes" \
              || { echo "ERROR: pid_t typedef anchor missing in $dctypes"; exit 1; }
            sed -i 's@^typedef int pid_t;  // matching what used to be in@#  ifdef __MINGW32__  // camoufox: MinGW pid_t (int on win32 / __int64 on win64)\n#    include <sys/types.h>\ntypedef _pid_t pid_t;  // identical-type redef is legal; also covers NO_OLDNAMES\n#  else\ntypedef int pid_t;  // matching what used to be in\n#  endif@' "$dctypes"
            echo "made desktop_capture_types.h pid_t typedef MinGW-aware"
          fi

          # (17) dom/media/systemservices/video_engine/desktop_device_info.cc defines
          # DesktopSource::setPid(const int) but its header declares setPid(pid_t)
          # (and mPid/getPid are pid_t). On MSVC and i686 pid_t==int so it matched;
          # with (16) giving MinGW its native pid_t (__int64 on win64) the int def no
          # longer matches the pid_t decl -> "out-of-line definition of 'setPid' does
          # not match any declaration in 'webrtc::DesktopSource'". The header is
          # canonical (everything else uses pid_t), so align the def. Same class as (15).
          ddinfo="${src_dir}dom/media/systemservices/video_engine/desktop_device_info.cc"
          test -f "$ddinfo" || { echo "ERROR: $ddinfo not found"; exit 1; }
          if grep -q 'setPid(const pid_t aPid)' "$ddinfo"; then
            echo "NOTE: desktop_device_info.cc setPid already pid_t; skipping."
          else
            grep -q 'void DesktopSource::setPid(const int aPid)' "$ddinfo" \
              || { echo "ERROR: setPid(const int) anchor missing in $ddinfo"; exit 1; }
            sed -i 's@void DesktopSource::setPid(const int aPid)@void DesktopSource::setPid(const pid_t aPid)@' "$ddinfo"
            echo "aligned desktop_device_info.cc setPid def to pid_t"
          fi

          # (18) dom/media/webrtc/libwebrtcglue/VideoConduit.cpp guards its ntohs
          # include with `#ifdef _MSC_VER ... #else #include <netinet/in.h>`. On MinGW
          # _MSC_VER is undefined, so it takes the Unix branch and fails with
          # "'netinet/in.h' file not found". Its sibling AudioConduit.cpp (same dir)
          # uses the correct idiom -- HAVE_NETINET_IN_H (unset on Windows) else
          # `defined XP_WIN` -> <winsock2.h>. Adopt that idiom verbatim (lowercase
          # <winsock2.h>: the CI filesystem is case-sensitive and MinGW ships it
          # lowercase). Fixed-block replace, hard-fail if the anchor block is gone.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'dom', 'media', 'webrtc', 'libwebrtcglue', 'VideoConduit.cpp')
          s = open(f, encoding='utf-8').read()
          old = '#ifdef _MSC_VER\n#  include "Winsock2.h"\n#else\n#  include <netinet/in.h>\n#endif'
          new = '#ifdef HAVE_NETINET_IN_H\n#  include <netinet/in.h>\n#elif defined XP_WIN\n#  include <winsock2.h>\n#endif'
          if new in s:
              print('NOTE: VideoConduit ntohs include already fixed; skipping.')
          elif old not in s:
              sys.exit('ERROR: ntohs _MSC_VER include block anchor missing in ' + f)
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print('rewrote VideoConduit.cpp ntohs include to XP_WIN/<winsock2.h> idiom')
          PYEOF

          # (19) third_party/sipcc/cpr_win_types.h provides MSVC-style `typedef int
          # ssize_t` (guarded by _SSIZE_T_, which is the WRONG macro for mingw-w64 --
          # it uses _SSIZE_T_DEFINED) and an unguarded `typedef int pid_t`. On MinGW
          # both clash with the native long-long types -> "typedef redefinition with
          # different types ('int' vs 'long long')" / "('int' vs '_pid_t')" (hit via
          # dom/media/webrtc/sdp). The clash itself proves the native types are present
          # in this TU, but to be robust we pull <sys/types.h> on MinGW (defines both
          # ssize_t and pid_t) and skip the int typedefs; MSVC keeps them.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'third_party', 'sipcc', 'cpr_win_types.h')
          s = open(f, encoding='utf-8').read()
          old = ('#ifndef _SSIZE_T_\n#define _SSIZE_T_\ntypedef int ssize_t;\n#endif\n\n'
                 '/*\n * Define pid_t.\n */\ntypedef int pid_t;')
          new = ('#ifdef __MINGW32__  /* camoufox: MinGW <sys/types.h> already defines\n'
                 '   ssize_t and pid_t with native (long long) widths; the int typedefs\n'
                 '   below would be a "redefinition with different types". */\n'
                 '#  include <sys/types.h>\n#else\n'
                 '#ifndef _SSIZE_T_\n#define _SSIZE_T_\ntypedef int ssize_t;\n#endif\n\n'
                 '/*\n * Define pid_t.\n */\ntypedef int pid_t;\n#endif')
          if '__MINGW32__' in s:
              print('NOTE: cpr_win_types.h already MinGW-aware; skipping.')
          elif old not in s:
              sys.exit('ERROR: ssize_t/pid_t typedef block anchor missing in ' + f)
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print('made cpr_win_types.h ssize_t/pid_t MinGW-aware')
          PYEOF

          # (20) nICEr addrs-win32.cpp accesses `addrs[n].interface.{type,
          # estimated_speed}` -- `interface` is a struct field (nr_local_addr in
          # net/local_addr.h). But this file #includes <iphlpapi.h> -> windows.h ->
          # objbase.h, which does `#define interface struct`, so `.interface` expands
          # to `.struct` -> "expected unqualified-id". The file never uses the COM
          # `interface` keyword, so #undef the macro after the Windows includes.
          aw32="${src_dir}dom/media/webrtc/transport/third_party/nICEr/src/stun/addrs-win32.cpp"
          test -f "$aw32" || { echo "ERROR: $aw32 not found"; exit 1; }
          if grep -q '^#undef interface' "$aw32"; then
            echo "NOTE: addrs-win32.cpp already #undef interface; skipping."
          else
            grep -q '^#include <iphlpapi.h>' "$aw32" \
              || { echo "ERROR: iphlpapi.h anchor missing in $aw32"; exit 1; }
            sed -i 's@^#include <iphlpapi.h>@#include <iphlpapi.h>\n#undef interface  // camoufox: objbase.h #defines interface->struct; nICEr uses it as a field@' "$aw32"
            echo "added #undef interface to addrs-win32.cpp"
          fi

          # (21) nrappkit r_log.cpp guards its POSIX includes with `#ifndef
          # _MSC_VER`, but MinGW does not define _MSC_VER, so it takes the POSIX
          # branch and pulls in <syslog.h>, which MinGW-w64 lacks -> "fatal
          # error: 'syslog.h' file not found". MinGW *does* ship <strings.h>
          # (strcasecmp), so only <syslog.h> is the problem. On the WINNT target
          # common.build defines WIN32 and adds the win32 csi_platform.h port,
          # which already supplies LOG_EMERG/LOG_DEBUG; the lone vsyslog() call
          # is itself `#ifndef WIN32`-guarded. So wrap only the <syslog.h>
          # include in `#ifndef WIN32` (same idiom this file uses elsewhere).
          rlog="${src_dir}dom/media/webrtc/transport/third_party/nrappkit/src/log/r_log.cpp"
          test -f "$rlog" || { echo "ERROR: $rlog not found"; exit 1; }
          if grep -q 'camoufox: MinGW lacks <syslog.h>' "$rlog"; then
            echo "NOTE: r_log.cpp syslog.h already WIN32-guarded; skipping."
          else
            grep -q '^#include <syslog.h>' "$rlog" \
              || { echo "ERROR: <syslog.h> anchor missing in $rlog"; exit 1; }
            sed -i 's@^#include <syslog.h>@#ifndef WIN32  // camoufox: MinGW lacks <syslog.h>; csi_platform.h supplies LOG_* and vsyslog() is WIN32-guarded\n#include <syslog.h>\n#endif@' "$rlog"
            echo "WIN32-guarded <syslog.h> include in r_log.cpp"
          fi

          # (22) nrappkit registry.cpp is the ONE remaining file (alongside
          # r_log.cpp, fixed in 21) that guards its POSIX includes with the wrong
          # `#ifndef _MSC_VER` -- MinGW is not _MSC_VER so it takes the POSIX
          # branch and pulls <netinet/in.h>, which MinGW-w64 lacks -> "fatal
          # error: 'netinet/in.h' file not found". Its sibling registry_local.cpp
          # (identical include block) already uses the correct `#ifndef WIN32`.
          # On Windows csi_platform.h pulls <winsock2.h> (in_addr/htons/...) and
          # maps strcasecmp->_stricmp, so none of strings.h/sys/param.h/
          # netinet/in.h are needed. Flip the lone guard to match the sibling.
          # (Safe everywhere: on Linux/macOS neither _MSC_VER nor WIN32 is
          # defined, so the POSIX branch is taken either way.)
          reg="${src_dir}dom/media/webrtc/transport/third_party/nrappkit/src/registry/registry.cpp"
          test -f "$reg" || { echo "ERROR: $reg not found"; exit 1; }
          if grep -q '^#ifndef WIN32' "$reg"; then
            echo "NOTE: registry.cpp already WIN32-guarded; skipping."
          else
            grep -q '^#ifndef _MSC_VER' "$reg" \
              || { echo "ERROR: _MSC_VER guard anchor missing in $reg"; exit 1; }
            sed -i 's@^#ifndef _MSC_VER@#ifndef WIN32  /* camoufox: MinGW lacks netinet/in.h; csi_platform.h pulls winsock2.h. Match sibling registry_local.cpp */@' "$reg"
            echo "flipped registry.cpp POSIX-include guard _MSC_VER -> WIN32"
          fi

          # (23) gfx/cairo cairo-dwrite-font.cpp initializes a
          # DWRITE_GLYPH_IMAGE_FORMATS variable from `FLAG_A | FLAG_B | ...`. On
          # MSVC the DWrite SDK applies DEFINE_ENUM_FLAG_OPERATORS to this enum so
          # `enum | enum` yields the enum type; mingw-w64's dwrite headers do NOT,
          # so the OR decays to `int` -> "cannot initialize a variable of type
          # 'DWRITE_GLYPH_IMAGE_FORMATS' with an rvalue of type 'int'". Wrap the
          # OR expression in a C-style cast back to the enum (no-op on MSVC).
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'gfx', 'cairo', 'cairo', 'src', 'win32',
                           'cairo-dwrite-font.cpp')
          s = open(f, encoding='utf-8').read()
          old = (
              '    DWRITE_GLYPH_IMAGE_FORMATS supported_formats =\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_COLR |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_SVG |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_PNG |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_JPEG |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_TIFF |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_PREMULTIPLIED_B8G8R8A8;')
          new = (
              '    DWRITE_GLYPH_IMAGE_FORMATS supported_formats =\n'
              '        (DWRITE_GLYPH_IMAGE_FORMATS)(  /* camoufox: mingw-w64 dwrite lacks DEFINE_ENUM_FLAG_OPERATORS here; enum|enum decays to int, cast back */\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_COLR |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_SVG |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_PNG |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_JPEG |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_TIFF |\n'
              '        DWRITE_GLYPH_IMAGE_FORMATS_PREMULTIPLIED_B8G8R8A8);')
          if '(DWRITE_GLYPH_IMAGE_FORMATS)(' in s:
              print('NOTE: cairo-dwrite-font.cpp supported_formats already cast; skipping.')
          elif old not in s:
              sys.exit('ERROR: supported_formats enum-OR anchor missing in ' + f)
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print('cast supported_formats enum-OR to DWRITE_GLYPH_IMAGE_FORMATS')
          PYEOF

          # (24) gfx/skia SkScalerContext_win_dw.cpp calls the 4-arg per-glyph
          # IDWriteFontFace4::GetGlyphImageFormats(glyphId, ppemFirst, ppemLast,
          # &formats). mingw-w64's dwrite_3.h cannot have two same-named methods
          # in its C-compatible interface, so it renames the overloaded 4-arg
          # variant to GetGlyphImageFormats_ (trailing underscore) and keeps the
          # plain name for the 0-arg whole-font variant -> the 4-arg call resolves
          # to the 0-arg decl: "too many arguments to function call, expected 0,
          # have 4". Route the call to GetGlyphImageFormats_ on MinGW (identical
          # signature, full functionality -- SVG-in-OpenType glyph rendering).
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'gfx', 'skia', 'skia', 'src', 'ports',
                           'SkScalerContext_win_dw.cpp')
          s = open(f, encoding='utf-8').read()
          old = (
              '    HRBM(fontFace4->GetGlyphImageFormats(glyph.getGlyphID(), 0, UINT32_MAX, &imageFormats),\n'
              '         "Cannot get glyph image formats.");')
          new = (
              '#ifdef __MINGW32__  // camoufox: mingw-w64 renames the overloaded 4-arg per-glyph GetGlyphImageFormats to GetGlyphImageFormats_ (C-compat headers cannot overload); the 0-arg whole-font variant keeps the plain name\n'
              '    HRBM(fontFace4->GetGlyphImageFormats_(glyph.getGlyphID(), 0, UINT32_MAX, &imageFormats),\n'
              '         "Cannot get glyph image formats.");\n'
              '#else\n'
              '    HRBM(fontFace4->GetGlyphImageFormats(glyph.getGlyphID(), 0, UINT32_MAX, &imageFormats),\n'
              '         "Cannot get glyph image formats.");\n'
              '#endif')
          # Two identical call sites: drawSVGImage (live) and generatePngMetrics
          # (under #ifdef USE_PNG, currently dead) -- patch BOTH (replace-all) so
          # the fix is robust if USE_PNG is ever enabled.
          if 'GetGlyphImageFormats_(' in s:
              print('NOTE: SkScalerContext already uses GetGlyphImageFormats_; skipping.')
          elif old not in s:
              sys.exit('ERROR: GetGlyphImageFormats 4-arg call anchor missing in ' + f)
          else:
              n = s.count(old)
              open(f, 'w', encoding='utf-8').write(s.replace(old, new))
              print('mingw: routed %d SkScalerContext GetGlyphImageFormats(4-arg) call(s) to GetGlyphImageFormats_' % n)
          PYEOF

          # (25) gfx/thebes DeviceManagerDx.cpp probes IDCompositionDevice4 (a
          # Windows-11-era interface, CheckCompositionTextureSupport) to decide
          # mSupportsDCompositionTexture. Ubuntu 24.04's mingw-w64 (11.0.1, 2023)
          # does not declare IDCompositionDevice4 -> "use of undeclared identifier
          # 'IDCompositionDevice4'". It only gates a WebRender DComposition-texture
          # overlay optimization (gfxVars::UseWebRenderDCompositionTextureOverlayWin),
          # so disable the probe on MinGW (return false) -- no rendering/correctness
          # impact. (Newer mingw-w64 has the interface; revisit if the toolchain bumps.)
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'gfx', 'thebes', 'DeviceManagerDx.cpp')
          s = open(f, encoding='utf-8').read()
          old = (
              '  const bool supported = [device, compositionDevice] {\n'
              '    HRESULT hr;\n'
              '    RefPtr<IDCompositionDevice4> dcomp4;\n'
              '    hr = compositionDevice->QueryInterface(\n'
              '        (IDCompositionDevice4**)getter_AddRefs(dcomp4));\n'
              '    if (FAILED(hr)) {\n'
              '      return false;\n'
              '    }\n'
              '\n'
              '    BOOL supportCompositionTexture = FALSE;\n'
              '    hr = dcomp4->CheckCompositionTextureSupport(device,\n'
              '                                                &supportCompositionTexture);\n'
              '    if (FAILED(hr)) {\n'
              '      return false;\n'
              '    }\n'
              '\n'
              '    if (supportCompositionTexture == FALSE) {\n'
              '      return false;\n'
              '    }\n'
              '\n'
              '    return true;\n'
              '  }();')
          new = (
              '  const bool supported = [device, compositionDevice] {\n'
              '#ifdef __MINGW32__\n'
              '    // camoufox: Ubuntu mingw-w64 (11.0.1) lacks IDCompositionDevice4, a\n'
              '    // Win11-era interface (CheckCompositionTextureSupport). Disable the\n'
              '    // WebRender DComposition-texture overlay probe -- a pure perf\n'
              '    // optimization (UseWebRenderDCompositionTextureOverlayWin), no\n'
              '    // rendering/correctness impact.\n'
              '    (void)device;\n'
              '    (void)compositionDevice;\n'
              '    return false;\n'
              '#else\n'
              '    HRESULT hr;\n'
              '    RefPtr<IDCompositionDevice4> dcomp4;\n'
              '    hr = compositionDevice->QueryInterface(\n'
              '        (IDCompositionDevice4**)getter_AddRefs(dcomp4));\n'
              '    if (FAILED(hr)) {\n'
              '      return false;\n'
              '    }\n'
              '\n'
              '    BOOL supportCompositionTexture = FALSE;\n'
              '    hr = dcomp4->CheckCompositionTextureSupport(device,\n'
              '                                                &supportCompositionTexture);\n'
              '    if (FAILED(hr)) {\n'
              '      return false;\n'
              '    }\n'
              '\n'
              '    if (supportCompositionTexture == FALSE) {\n'
              '      return false;\n'
              '    }\n'
              '\n'
              '    return true;\n'
              '#endif\n'
              '  }();')
          if 'lacks IDCompositionDevice4' in s:
              print('NOTE: DeviceManagerDx IDCompositionDevice4 probe already gated; skipping.')
          elif old not in s:
              sys.exit('ERROR: IDCompositionDevice4 lambda anchor missing in ' + f)
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print('mingw: disabled IDCompositionDevice4 DComposition-texture probe')
          PYEOF

          # (27) hal/windows/WindowsHeterogeneousCpuInfo.cpp calls the Win10 API
          # GetSystemCpuSetInformation directly. Ubuntu 24.04's mingw-w64 11.0.1
          # predates it: v11.0.1 processthreadsapi.h does NOT declare it at all
          # (added to mingw-w64 after 11.0.1, guarded _WIN32_WINNT>=WIN10), and
          # its import lib almost certainly lacks the symbol too -> a plain decl
          # would only move the failure to link time. The struct
          # SYSTEM_CPU_SET_INFORMATION *is* present (winnt.h), so only the
          # function is missing -> "use of undeclared identifier
          # 'GetSystemCpuSetInformation'". MSVC's SDK has it, so Mozilla (whose
          # only consumer is this one file) never trips. Resolve it from kernel32
          # via GetProcAddress (always linkable) and route the two call sites to
          # the shim with a macro -- works on the old toolchain AND newer
          # mingw/the SDK (the real decl appears via <windows.h> before this).
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'hal', 'windows', 'WindowsHeterogeneousCpuInfo.cpp')
          s = open(f, encoding='utf-8').read()
          anchor = '#include <windows.h>\n'
          shim = (
              '\n'
              '#ifdef __MINGW32__\n'
              '// camoufox: Ubuntu mingw-w64 11.0.1 predates the Win10 API\n'
              '// GetSystemCpuSetInformation (added to mingw-w64 after 11.0.1). The struct\n'
              '// SYSTEM_CPU_SET_INFORMATION is present in winnt.h; only the function decl +\n'
              '// import are missing. Resolve it from kernel32 at runtime so this TU compiles\n'
              '// AND links on the old toolchain, then route the call sites via a macro.\n'
              'static BOOL CamouGetSystemCpuSetInformation(SYSTEM_CPU_SET_INFORMATION* aInfo,\n'
              '                                            ULONG aLen, PULONG aRet,\n'
              '                                            HANDLE aProc, ULONG aFlags) {\n'
              '  using Fn = BOOL(WINAPI*)(SYSTEM_CPU_SET_INFORMATION*, ULONG, PULONG, HANDLE, ULONG);\n'
              '  static Fn sFn = reinterpret_cast<Fn>(::GetProcAddress(\n'
              '      ::GetModuleHandleW(L"kernel32.dll"), "GetSystemCpuSetInformation"));\n'
              '  if (!sFn) {\n'
              '    if (aRet) *aRet = 0;\n'
              '    return FALSE;\n'
              '  }\n'
              '  return sFn(aInfo, aLen, aRet, aProc, aFlags);\n'
              '}\n'
              '#define GetSystemCpuSetInformation CamouGetSystemCpuSetInformation\n'
              '#endif  // __MINGW32__\n')
          if 'CamouGetSystemCpuSetInformation' in s:
              print('NOTE: WindowsHeterogeneousCpuInfo GetSystemCpuSetInformation shim already present; skipping.')
          elif anchor not in s:
              sys.exit('ERROR: <windows.h> include anchor missing in ' + f)
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(anchor, anchor + shim, 1))
              print('mingw: shimmed GetSystemCpuSetInformation via GetProcAddress')
          PYEOF

          # (28) intl/locale/windows/OSPreferences_win.cpp reads system locales via
          # the WinRT GlobalizationPreferences API (ComPtr / HString /
          # IVectorView<HSTRING> / windows.system.userprofile.h). Two mingw-w64
          # 11.0.1 gaps hit this single TU: (i) its WRL corewrappers.h does NOT
          # define class HString at all (only forward-declares it + defines
          # HStringReference -> "unknown type name 'HString'"; newer mingw has it),
          # and (ii) windows.system.userprofile.h:160 has the same unqualified
          # elaborated-enum reference clang rejects as the windows.ui.composition.h
          # bug ("forward references to 'enum' types"). The function ALREADY has a
          # full non-WinRT fallback right below (GetUserPreferredUILanguages, a Vista+
          # Win32 API), and Camoufox drives locale via its own config anyway, so the
          # cleanest fix is to gate the WinRT path (its includes, its using-
          # directives, and its block in ReadSystemLocales) behind #ifndef __MINGW32__
          # and let the fallback run. Avoids backfilling two system headers (HString
          # class + enum qualification) for one optional code path. No other code in
          # the file touches WinRT (verified: ReadRegionalPrefsLocales etc. are pure
          # Win32). Hard-fails if any anchor drifts or is non-unique.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'intl', 'locale', 'windows', 'OSPreferences_win.cpp')
          s = open(f, encoding='utf-8').read()
          MARK = 'skip WinRT locale path on mingw'
          reps = [
              ('#include <roapi.h>\n'
               '#include <wrl.h>\n'
               '#include <windows.system.userprofile.h>\n',
               '#ifndef __MINGW32__  // camoufox: ' + MARK + ' (11.0.1 lacks WRL HString + a userprofile.h unqualified-enum bug)\n'
               '#include <roapi.h>\n'
               '#include <wrl.h>\n'
               '#include <windows.system.userprofile.h>\n'
               '#endif  // !__MINGW32__\n'),
              ('using namespace Microsoft::WRL;\n'
               'using namespace Microsoft::WRL::Wrappers;\n'
               'using namespace ABI::Windows::Foundation::Collections;\n'
               'using namespace ABI::Windows::System::UserProfile;\n',
               '#ifndef __MINGW32__\n'
               'using namespace Microsoft::WRL;\n'
               'using namespace Microsoft::WRL::Wrappers;\n'
               'using namespace ABI::Windows::Foundation::Collections;\n'
               'using namespace ABI::Windows::System::UserProfile;\n'
               '#endif  // !__MINGW32__\n'),
              ('  // Try to get language list from GlobalizationPreferences; if this fails,\n',
               '#ifndef __MINGW32__  // camoufox: ' + MARK + '\n'
               '  // Try to get language list from GlobalizationPreferences; if this fails,\n'),
              ('  }\n'
               '\n'
               '  // Per MSDN, GetUserPreferredUILanguages is available from Vista onwards,\n',
               '  }\n'
               '#endif  // !__MINGW32__ (camoufox: WinRT GlobalizationPreferences path)\n'
               '\n'
               '  // Per MSDN, GetUserPreferredUILanguages is available from Vista onwards,\n'),
          ]
          if MARK in s:
              print('NOTE: OSPreferences_win WinRT path already gated; skipping.')
          else:
              for old, new in reps:
                  n = s.count(old)
                  if n != 1:
                      sys.exit('ERROR: OSPreferences_win anchor count %d (need 1): %r' % (n, old[:60]))
                  s = s.replace(old, new, 1)
              open(f, 'w', encoding='utf-8').write(s)
              print('mingw: gated WinRT GlobalizationPreferences locale path in OSPreferences_win.cpp')
          PYEOF

          # (29) ipc/mscom/AgileReference.cpp calls ::RoGetAgileReference with the
          # AGILEREFERENCE_DEFAULT option (a Win10 1703 COM-marshaling API exported
          # by combase.dll). Ubuntu mingw-w64 11.0.1 declares neither the function
          # nor the AgileReferenceOptions enum -> "no member named
          # 'RoGetAgileReference'" + "use of undeclared identifier
          # 'AGILEREFERENCE_DEFAULT'". The IAgileReference interface itself IS present
          # (objidl.h), and this is core COM agile-marshaling with no fallback, so
          # (unlike #28) keep the functionality: resolve RoGetAgileReference from
          # combase.dll via GetProcAddress (link-safe), supply the default option
          # value, and route the call site with a macro. Sole user (grep). Same
          # technique as #27. Harmless on newer mingw / the SDK.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'ipc', 'mscom', 'AgileReference.cpp')
          s = open(f, encoding='utf-8').read()
          anchor = '#include "mozilla/mscom/Utils.h"\n'
          shim = (
              '\n'
              '#ifdef __MINGW32__\n'
              '// camoufox: Ubuntu mingw-w64 11.0.1 lacks RoGetAgileReference + the\n'
              '// AgileReferenceOptions enum (Win10 1703 API, exported by combase.dll).\n'
              '// IAgileReference itself is present (objidl.h). Resolve the function\n'
              '// dynamically so this TU compiles AND links on the old toolchain.\n'
              '#  include <windows.h>\n'
              '#  ifndef AGILEREFERENCE_DEFAULT\n'
              '#    define AGILEREFERENCE_DEFAULT 0\n'
              '#  endif\n'
              'static HRESULT CamouRoGetAgileReference(int aOptions, REFIID aRiid,\n'
              '                                        IUnknown* aUnk,\n'
              '                                        IAgileReference** aOut) {\n'
              '  using Fn = HRESULT(WINAPI*)(int, REFIID, IUnknown*, IAgileReference**);\n'
              '  static Fn sFn = reinterpret_cast<Fn>(::GetProcAddress(\n'
              '      ::GetModuleHandleW(L"combase.dll"), "RoGetAgileReference"));\n'
              '  if (!sFn) {\n'
              '    return E_NOTIMPL;\n'
              '  }\n'
              '  return sFn(aOptions, aRiid, aUnk, aOut);\n'
              '}\n'
              '#  define RoGetAgileReference CamouRoGetAgileReference\n'
              '#endif  // __MINGW32__\n')
          if 'CamouRoGetAgileReference' in s:
              print('NOTE: AgileReference RoGetAgileReference shim already present; skipping.')
          elif s.count(anchor) != 1:
              sys.exit('ERROR: Utils.h include anchor count %d (need 1) in %s' % (s.count(anchor), f))
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(anchor, anchor + shim, 1))
              print('mingw: shimmed RoGetAgileReference via GetProcAddress (combase.dll)')
          PYEOF

          # (30) js/src/util/CompleteFile.cpp picks the fastest getc:
          #   #if   defined(HAVE_GETC_UNLOCKED) -> getc_unlocked
          #   #elif defined(HAVE__GETC_NOLOCK)  -> _getc_nolock
          #   #else                              -> getc
          # js/moz.configure sets HAVE__GETC_NOLOCK via check_symbol("_getc_nolock"),
          # a LINK-only probe: the symbol is exported by the mingw CRT import lib, so
          # the probe passes -- but mingw's <stdio.h> hides the _getc_nolock
          # declaration in strict C++ mode, so the actual compile fails with "use of
          # undeclared identifier '_getc_nolock'". (MSVC, where Mozilla builds, both
          # links and declares it.) Rather than fight the header guard, fall through
          # to plain getc on mingw -- correct, always declared, only a negligible
          # per-char locking cost while slurping a file. Sole consumer (grep js/).
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'js', 'src', 'util', 'CompleteFile.cpp')
          s = open(f, encoding='utf-8').read()
          old = '#elif defined(HAVE__GETC_NOLOCK)\n'
          new = ('#elif defined(HAVE__GETC_NOLOCK) && !defined(__MINGW32__)  '
                 '// camoufox: mingw <stdio.h> hides the _getc_nolock decl in strict '
                 'C++ even though configure\'s link-only check_symbol finds it; use plain getc\n')
          if 'HAVE__GETC_NOLOCK) && !defined(__MINGW32__)' in s:
              print('NOTE: CompleteFile _getc_nolock already mingw-guarded; skipping.')
          elif s.count(old) != 1:
              sys.exit('ERROR: HAVE__GETC_NOLOCK #elif anchor count %d (need 1) in %s' % (s.count(old), f))
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print('mingw: routed CompleteFile fast_getc to plain getc (avoid hidden _getc_nolock decl)')
          PYEOF

          # (31) netwerk/sctp/src/user_environment.h defines the SCTP library's
          # min()/max() macros, but its guard `#if !defined(_MSC_VER) &&
          # !defined(__MINGW32__)` deliberately skips MinGW -- upstream assumes
          # <windows.h> supplies them on Windows. It normally would (minwindef.h
          # defines min/max for C, `#ifndef __cplusplus`), but Mozilla force-defines
          # NOMINMAX tree-wide (461x in this build), which suppresses them. The
          # netinet/*.c sources compile as C with -Werror=implicit-function-
          # declaration, so the first use (sctp_cc_functions.c:85 `min(...)`)
          # hard-errors "call to undeclared function 'min'/'max'". Provide the macros
          # for MinGW too, #ifndef-guarded so we never clash if a TU did get them
          # from windows.h. (x86_64 frontier; i686 had not reached this layer yet.)
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'netwerk', 'sctp', 'src', 'user_environment.h')
          s = open(f, encoding='utf-8').read()
          old = ('#if !defined(_MSC_VER) && !defined(__MINGW32__)\n'
                 '#define min(a,b) (((a)>(b))?(b):(a))\n'
                 '#define max(a,b) (((a)>(b))?(a):(b))\n'
                 '#endif')
          add = ('\n#if defined(__MINGW32__)  /* camoufox: SCTP min/max for MinGW. The guard\n'
                 '   above skips MinGW assuming <windows.h> supplies min/max, but Mozilla\n'
                 '   force-defines NOMINMAX tree-wide so minwindef.h does not. These C\n'
                 '   sources build with -Werror=implicit-function-declaration. #ifndef-\n'
                 '   guarded so we never clash if a TU did get them from windows.h. */\n'
                 '#ifndef min\n'
                 '#define min(a,b) (((a)>(b))?(b):(a))\n'
                 '#endif\n'
                 '#ifndef max\n'
                 '#define max(a,b) (((a)>(b))?(a):(b))\n'
                 '#endif\n'
                 '#endif')
          if 'camoufox: SCTP min/max for MinGW' in s:
              print('NOTE: user_environment.h SCTP min/max already MinGW-aware; skipping.')
          elif old not in s:
              sys.exit('ERROR: SCTP min/max guard block anchor missing in ' + f)
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, old + add, 1))
              print('added MinGW SCTP min/max macros to user_environment.h')
          PYEOF

          # (32) modules/fdlibm/src/math_private.h emulates FreeBSD's internal
          # double types: `typedef double __double_t; typedef __double_t double_t;
          # typedef float __float_t;`. On mingw-w64, <math.h> already typedefs
          # double_t (and float_t) with the FLT_EVAL_METHOD-correct width: `double`
          # on x86_64 (SSE2) but `long double` on i686 (x87 FPU). So our
          # `double_t == double` typedef is an identical-type redef on x86_64 (legal,
          # silent) but a CONFLICTING redef on i686 -> "typedef redefinition with
          # different types ('__double_t' (aka 'double') vs 'long double')".
          # __double_t/__float_t are fdlibm-internal names mingw does NOT provide, so
          # keep those; only skip our own double_t typedef on MinGW and let <math.h>
          # own it (pull it in to guarantee it is present). i686 frontier.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'modules', 'fdlibm', 'src', 'math_private.h')
          s = open(f, encoding='utf-8').read()
          old = 'typedef __double_t  double_t;'
          new = ('#if defined(__MINGW32__)  /* camoufox: mingw-w64 <math.h> already typedefs\n'
                 '   double_t with the FLT_EVAL_METHOD-correct width (double on x64, long\n'
                 '   double on i686 x87); redefining it as plain double here conflicts on\n'
                 '   i686. Keep __double_t/__float_t (fdlibm-internal, absent in mingw) and\n'
                 '   defer double_t to <math.h>. */\n'
                 '#include <math.h>\n'
                 '#else\n'
                 'typedef __double_t  double_t;\n'
                 '#endif')
          if 'camoufox: mingw-w64 <math.h> already typedefs' in s:
              print('NOTE: math_private.h double_t already MinGW-aware; skipping.')
          elif s.count(old) != 1:
              sys.exit('ERROR: double_t typedef anchor count %d (need 1) in %s' % (s.count(old), f))
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, new, 1))
              print('made math_private.h double_t typedef MinGW-aware (defer to <math.h>)')
          PYEOF

          # (33) dom/media/webrtc/transport/runnable_utils.h WrapRunnable path:
          # runnable_args_memfn{,_ret}::RunInternal do `std::apply(std::mem_fn(
          # mMethod), std::tuple_cat(std::tie(mObj), ...))`. On 32-bit Windows XPCOM
          # methods are virtual __stdcall (NS_IMETHOD), and libstdc++'s
          # std::_Mem_fn_traits has NO calling-convention specializations -> "implicit
          # instantiation of undefined template 'std::_Mem_fn_traits<nsresult
          # (nsIThread::*)() __stdcall>'" (hit via netwerk/sctp/datachannel/
          # DataChannel.cpp -> WrapRunnable(thread, &nsIThread::...)). Exactly the
          # same root cause as fix (14)'s ResultExtensions MemFnInvoker, but a
          # different mem_fn call site that (14) did not cover. std::invoke is
          # calling-convention agnostic (deduces from the call expression, never
          # instantiates _Mem_fn_traits), so replace each std::mem_fn(mMethod) with an
          # equivalent std::invoke call wrapper lambda -- a unique closure type per
          # site (no ODR clash with (14)'s mozilla::detail::MemFnInvoker), needs no
          # new include (<functional>/<utility> already included), and is behaviorally
          # identical (std::apply(std::mem_fn(p), t) == std::apply([](a...){return
          # std::invoke(p,a...);}, t)). x86_64 is unaffected (__stdcall is a no-op) but
          # the rewrite is harmless there; applied on both Windows arches.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'dom', 'media', 'webrtc', 'transport',
                           'runnable_utils.h')
          s = open(f, encoding='utf-8').read()
          old = 'std::mem_fn(mMethod)'
          new = ('[this](auto&&... aArgs) -> decltype(auto) {  '
                 '// camoufox: std::invoke is calling-convention agnostic; std::mem_fn '
                 'has no __stdcall _Mem_fn_traits specialization in libstdc++ (32-bit '
                 'XPCOM methods)\n'
                 '                 return ::std::invoke(mMethod, '
                 'std::forward<decltype(aArgs)>(aArgs)...);\n'
                 '               }')
          if 'camoufox: std::invoke is calling-convention agnostic' in s:
              print('NOTE: runnable_utils.h mem_fn already invoke-wrapped; skipping.')
          elif s.count(old) != 2:
              sys.exit('ERROR: std::mem_fn(mMethod) anchor count %d (need 2) in %s'
                       % (s.count(old), f))
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(old, new))
              print('mingw: invoke-wrapped 2 std::mem_fn(mMethod) sites in runnable_utils.h')
          PYEOF

          # (34) third_party/libwebrtc common_audio/fir_filter_factory_gn builds
          # fir_filter_sse.cc (SSE intrinsics: _mm_*_ps) as part of its
          # UNIFIED_SOURCES. The GN->moz.build translation adds `-msse2` for the
          # Android-x86 and Linux-x86 cases but has NO WINNT-x86 block, so on the
          # i686 windows-gnu cross-build the unit compiles with no SSE support ->
          # "always_inline function '_mm_setzero_ps' requires target feature 'sse'".
          # MSVC defaults 32-bit to /arch:SSE2 (and Firefox's i686 baseline IS
          # SSE2), so Mozilla never trips. x86_64 is unaffected (SSE2 is ABI
          # baseline there). Add the missing WINNT-x86 -msse2 block, mirroring the
          # existing Linux-x86 one. Anchored on the trailing Library() call so it is
          # robust to the auto-generated body drifting between FF point releases.
          # NOTE: if more libwebrtc *_sse*.cc targets surface the same gap, escalate
          # to a global i686 -msse2 baseline (mozconfig) instead of per-moz.build.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'third_party', 'libwebrtc', 'common_audio',
                           'fir_filter_factory_gn', 'moz.build')
          s = open(f, encoding='utf-8').read()
          anchor = 'Library("fir_filter_factory_gn")'
          block = ('if CONFIG["OS_TARGET"] == "WINNT" and CONFIG["TARGET_CPU"] == "x86":\n'
                   '\n'
                   '    CXXFLAGS += [  # camoufox: GN->moz.build omits the WINNT-x86 SSE flag; fir_filter_sse.cc needs SSE (MSVC defaults x86 to /arch:SSE2)\n'
                   '        "-msse2"\n'
                   '    ]\n'
                   '\n\n')
          if 'camoufox: GN->moz.build omits the WINNT-x86 SSE flag' in s:
              print('NOTE: fir_filter_factory_gn already has WINNT-x86 -msse2; skipping.')
          elif s.count(anchor) != 1:
              sys.exit('ERROR: Library() anchor count %d (need 1) in %s' % (s.count(anchor), f))
          else:
              open(f, 'w', encoding='utf-8').write(s.replace(anchor, block + anchor, 1))
              print('added WINNT-x86 -msse2 block to fir_filter_factory_gn/moz.build')
          PYEOF

          # (35) Disable the libwebrtc WGC (Windows.Graphics.Capture) desktop
          # capturer on MinGW. modules/desktop_capture/win/wgc_*.cc pull in WinRT
          # projection headers that Ubuntu's mingw-w64 11.0.1 lacks -- and at least
          # one, <windows.graphics.directx.direct3d11.interop.h>, does not exist in
          # ANY mingw-w64 version (absent even in master/v12), so it cannot be
          # backfilled. WGC is the modern Win10+ screen-capture path; Camoufox uses
          # headless/juggler capture and the GDI/DXGI capturers remain, so dropping
          # WGC is functionally safe. We deliberately do NOT undefine
          # RTC_ENABLE_WIN_WGC: desktop_capture_options.h gates four member vars on
          # it, and that struct is included tree-wide, so flipping the macro in only
          # some TUs would be an ODR/ABI mismatch. Instead, keep the macro (layout
          # unchanged everywhere) and (a) drop the 4 wgc_*.cc from the build, (b)
          # gate desktop_capturer.cc's 3 WGC blocks (the wgc include + the two
          # factory branches) with `&& !defined(__MINGW32__)` so they fall through
          # to the existing CreateRaw{Window,Screen}Capturer (GDI/DXGI) paths. No
          # other TU references the WgcCapturerWin/IsWgcSupported symbols.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          # (a) remove the 4 wgc_*.cc entries from desktop_capture_gn UNIFIED_SOURCES
          mb = os.path.join(src_dir, 'third_party', 'libwebrtc', 'modules',
                            'desktop_capture', 'desktop_capture_gn', 'moz.build')
          s = open(mb, encoding='utf-8').read()
          lines = s.splitlines(keepends=True)
          kept = [ln for ln in lines if 'desktop_capture/win/wgc_' not in ln]
          removed = len(lines) - len(kept)
          if 'desktop_capture/win/wgc_' not in s:
              print('NOTE: desktop_capture_gn already has no wgc_ sources; skipping.')
          elif removed != 4:
              sys.exit('ERROR: expected to remove 4 wgc_ source lines, removed %d in %s' % (removed, mb))
          else:
              open(mb, 'w', encoding='utf-8').write(''.join(kept))
              print('removed %d wgc_*.cc sources from desktop_capture_gn/moz.build' % removed)
          # (b) gate the WGC blocks (wgc include + factory/fallback uses) in the
          # desktop_capture consumers on !__MINGW32__. desktop_capturer.cc (3 blocks)
          # and window_capturer_win.cc (2 blocks) are the ONLY TUs that reference
          # WgcCapturerWin/IsWgcSupported (verified across the module). Gating their
          # `#if defined(RTC_ENABLE_WIN_WGC)` makes them fall through to the GDI/DXGI
          # capturers and removes every use of the (header-neutered) WGC classes.
          # The macro stays defined (no ODR change to DesktopCaptureOptions).
          # window_capturer_win.cc was the hidden gn2 consumer that 35c's neutering
          # exposed as "use of undeclared identifier 'WgcCapturerWin'" (run
          # 27845741583, i686) -- it is patched here so its uses are gated, not just
          # its include.
          old = '#if defined(RTC_ENABLE_WIN_WGC)'
          new = '#if defined(RTC_ENABLE_WIN_WGC) && !defined(__MINGW32__)  // camoufox: WGC unbuildable on mingw (missing WinRT headers); fall through to GDI/DXGI'
          for rel in ['desktop_capturer.cc', 'window_capturer_win.cc']:
              cc = os.path.join(src_dir, 'third_party', 'libwebrtc', 'modules',
                                'desktop_capture', rel)
              if not os.path.exists(cc):
                  print('NOTE: %s not found; skipping.' % rel)
                  continue
              t = open(cc, encoding='utf-8').read()
              if '!defined(__MINGW32__)  // camoufox: WGC unbuildable' in t:
                  print('NOTE: %s WGC blocks already mingw-gated; skipping.' % rel)
                  continue
              n = t.count(old)
              if n == 0:
                  sys.exit('ERROR: no RTC_ENABLE_WIN_WGC blocks found in %s' % cc)
              open(cc, 'w', encoding='utf-8').write(t.replace(old, new))
              print('mingw-gated %d WGC blocks in %s' % (n, rel))
          # (c) Belt-and-suspenders: neuter the 4 wgc_*.h headers on mingw by
          # wrapping each whole file in `#ifndef __MINGW32__`. Run 27838322506
          # showed a wgc header was STILL compiled (in Unified_cpp_desktop_capture_
          # gn2) after (a)+(b) -- some TU pulls in wgc_capture_session.h whose
          # unconditional `#include <windows.graphics.h>` (+ *.interop.h, absent in
          # ALL mingw) fails. Making the headers empty on mingw kills the missing-
          # WinRT-header error for ANY includer, known or not; the wgc classes have
          # no remaining consumer ((a) removed the .cc, (b) gated the factory). If a
          # real use ever surfaces it becomes a clear "unknown type" we can gate.
          for hdr in ['wgc_capture_session.h', 'wgc_capture_source.h',
                      'wgc_capturer_win.h', 'wgc_desktop_frame.h']:
              p = os.path.join(src_dir, 'third_party', 'libwebrtc', 'modules',
                               'desktop_capture', 'win', hdr)
              if not os.path.exists(p):
                  print('NOTE: %s not found; skipping neuter.' % hdr)
                  continue
              h = open(p, encoding='utf-8').read()
              if 'camoufox: WGC header neutered' in h:
                  print('NOTE: %s already neutered; skipping.' % hdr)
                  continue
              open(p, 'w', encoding='utf-8').write(
                  '#ifndef __MINGW32__  // camoufox: WGC header neutered on mingw '
                  '(WinRT headers <windows.graphics.h>/*.interop.h absent from mingw-w64)\n'
                  + h.rstrip('\n') + '\n#endif  // !__MINGW32__\n')
              print('neutered %s on mingw' % hdr)
          PYEOF

          # (36) third_party/libwebrtc/rtc_base/platform_thread_types.cc names the
          # current thread two ways on Windows: the modern SetThreadDescription API
          # (Win10 1607+, GetProcAddress'd) AND a legacy fallback that raises the
          # magic debugger exception 0x406D1388 inside an MSVC SEH `__try`/`__except`
          # block. clang for *-windows-gnu (mingw) does not implement MSVC SEH, so
          # `__except` is "use of undeclared identifier '__except'" + a parse error.
          # The modern path already names threads on every target Camoufox runs
          # (Win10+), so gate the legacy SEH block (the threadname_info struct + the
          # __try/__except) out on mingw; naming still works via SetThreadDescription.
          python3 - "$src_dir" <<'PYEOF'
          import sys, os
          src_dir = sys.argv[1]
          f = os.path.join(src_dir, 'third_party', 'libwebrtc', 'rtc_base',
                           'platform_thread_types.cc')
          s = open(f, encoding='utf-8').read()
          a = '#pragma pack(push, 8)'
          b = '#pragma warning(pop)'
          if 'camoufox: MSVC SEH' in s:
              print('NOTE: platform_thread_types.cc SEH block already gated; skipping.')
          elif s.count(a) != 1 or s.count(b) != 1 or '__except' not in s:
              sys.exit('ERROR: SEH anchors not unique/present in ' + f)
          else:
              s = s.replace(a, '#ifndef __MINGW32__  // camoufox: MSVC SEH (__try/__except) '
                            'unsupported by clang/mingw; SetThreadDescription above already '
                            'names threads on Win10+\n' + a, 1)
              s = s.replace(b, b + '\n#endif  // !__MINGW32__', 1)
              open(f, 'w', encoding='utf-8').write(s)
              print('mingw-gated the legacy SEH thread-naming block in platform_thread_types.cc')
          PYEOF

      - name: Validate patch graph
        run: python3 ./scripts/validate_patches.py

      - name: Compile Python sources
        run: python3 -m compileall pythonlib/camoufox scripts

      - name: Create swap space
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Pre-build diagnostics
        if: matrix.target == 'windows'
        run: |
          echo "=== WINE configuration ==="
          echo "WINE=${WINE:-<unset>}"
          echo "WINEARCH=${WINEARCH:-<unset>}"
          echo "WINEPREFIX=${WINEPREFIX:-<unset>}"
          echo "FXC env=${FXC:-<unset>}"
          ls -la /usr/local/bin/wine-fxc-wrapper /usr/local/bin/fxc2.exe /usr/local/bin/d3dcompiler_47.dll || true
          echo "=== /usr/lib/wine/ contents (verify .real backup + wrapper install) ==="
          ls -la /usr/lib/wine/wine64 /usr/lib/wine/wine64.real 2>/dev/null || true
          ls -la /usr/lib/x86_64-linux-gnu/wine/wine64 /usr/lib/x86_64-linux-gnu/wine/wine64.real 2>/dev/null || true
          echo "=== Wrapper execve check (canonical path) ==="
          python3 -c "import subprocess; print(subprocess.check_output(['/usr/local/bin/wine-fxc-wrapper', '--version']).decode().strip())"
          echo "=== Wrapper execve check (intercept path: /usr/lib/wine/wine64) ==="
          # If our intercept install worked, this MUST also exec through the
          # wrapper. If wine reports a normal --version output, the chain works.
          python3 -c "import subprocess; print(subprocess.check_output(['/usr/lib/wine/wine64', '--version']).decode().strip())" || echo "intercept exec failed"

      - name: Build
        # Tee the entire build log to disk so we can attach it as an artifact
        # on failure. Without this, GitHub's UI truncates long output and the
        # actual error (often early C++ compile failures hidden behind a long
        # parallel rust build) is lost. Use PIPESTATUS to surface the real
        # exit code, since `tee` always succeeds.
        # MACH_BUILD_ARGS=--verbose is set for Windows so that mach passes
        # --verbose to gmake, disabling the -s (silent) flag and surfacing the
        # exact failing compiler/linker command in the artifact log.
        env:
          MACH_BUILD_ARGS: ${{ matrix.target == 'windows' && '--verbose' || '' }}
        run: |
          set -o pipefail
          mkdir -p build-logs
          python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }} 2>&1 | tee "build-logs/build-${{ matrix.target }}-${{ matrix.arch }}.log"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog-${{ matrix.target }}-${{ matrix.arch }}
          path: build-logs/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    # Gate the entire job on tag pushes instead of only the Create Release
    # step. Without this, the job spun up on every PR and `push` to a branch,
    # downloaded all 7 matrix artifacts (several GB), then no-op'd at the
    # Create Release step. Tag-gating at job level skips the runner entirely
    # for non-tag refs.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        # Pinned to the immutable commit SHA of tag v2.6.2 (supply-chain
        # hardening). softprops/action-gh-release runs with contents:write,
        # so a hijacked tag could tamper with published release assets.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
