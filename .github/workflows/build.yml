name: Build and Release

on:
  workflow_dispatch:
    inputs:
      only_target:
        description: "Build only this target to save time while iterating (linux / windows / macos). Use 'all' for the full 7-leg matrix."
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - "**"

# Opt every JavaScript action into the Node.js 24 runtime now. GitHub
# deprecated Node 20 (forced to Node 24 on 2026-06-16, removed 2026-09-16);
# this clears the "running on Node.js 20" warnings for the actions we do not
# bump by hand (setup-go, cache, upload-artifact, download-artifact) without a
# risky multi-major version jump. checkout/setup-python are additionally
# bumped to their Node 24 majors below. See:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-python:
    # Lightweight job that runs pythonlib unit tests and the patch conflict
    # check on every push/PR. Added per AUDIT_2026-05-15.md priority fix #6
    # (track pythonlib/tests in CI) and #4 (fail CI on unallowed hard
    # conflicts via patch.py --check-conflicts --strict).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check lockfile is in sync with requirements.txt
        # Fail fast with an actionable message if requirements.txt was edited
        # without regenerating requirements.lock. Without this, drift surfaces
        # much later as a cryptic pip HashMismatch or a silently missing
        # dependency (this exact check caught httpx[http2] being absent from
        # the lock). `packaging` is the only import the checker needs.
        run: |
          python -m pip install --quiet packaging
          python scripts/check_lockfile.py

      - name: Install dependencies
        # Use requirements.lock (hash-pinned, generated by pip-compile) so CI
        # installs are reproducible and tamper-resistant. requirements.txt
        # is the editable source; refresh the lockfile with:
        #   pip-compile --allow-unsafe --generate-hashes \
        #     --output-file=requirements.lock requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install ./pythonlib

      - name: Validate patch graph
        run: python3 ./scripts/validate_patches.py

      - name: Check patch conflicts (report-only)
        # Report-only (no --strict). After adopting upstream camoufox's coherent
        # 150 patch set, many spoofing patches intentionally edit the same
        # Window.webidl / nsGlobalWindowInner lines and compose in apply order
        # (upstream applies them sequentially). The --strict gate was tuned for
        # the fork's earlier feature-split patches and flags those by-design
        # overlaps as hard conflicts. The authoritative check that the patches
        # actually compose is apply-check, which applies them in order against
        # real Firefox source.
        run: python3 ./scripts/patch.py --check-conflicts

      - name: Run pythonlib tests
        run: pytest -q pythonlib/tests

  build-utls-proxy:
    # Compile + vet the experimental uTLS sidecar in the main CI. Previously
    # the matrix installed Go (`Set up Go`) but never built the proxy, so a
    # Go regression was only caught inside Dockerfile.slim's builder stage —
    # i.e. never in a PR. This fast job closes that gap.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet and build sidecar
        working-directory: bundle/_experimental
        run: |
          set -eux
          go vet ./...
          CGO_ENABLED=0 go build -o /tmp/utls_proxy ./utls_proxy.go

  apply-check:
    # Real apply-probe: extract Firefox $(version).$(release), git init, then
    # run `make dir` which calls scripts/patch.py to actually apply all 57
    # patches (2 numeric-prefixed playwright/juggler bootstrap patches first,
    # then the 55 manifest-claimed feature patches). If any patch has drifted
    # from the source tree (renamed file,
    # moved line, removed context), it fails here in ~5 minutes instead of
    # ~30+ minutes per worker after rust+C++ compile in the matrix. Single
    # apply-check vs. 7 matrix duplications saves ~3.5h of wasted CI on a
    # broken patchset.
    needs: test-python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimum deps
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full wget

      - name: Cache Firefox source tarball
        # Re-use the 677MB tarball across runs. Keyed on upstream.sh so a
        # version bump invalidates it automatically.
        uses: actions/cache@v4
        with:
          path: firefox-*.source.tar.xz
          key: firefox-source-${{ hashFiles('upstream.sh') }}-v1

      - name: Fetch source
        run: make fetch

      - name: Setup source and apply patches
        # `make dir` runs `make setup` (git init + repo-local identity +
        # initial commit + tag "unpatched") then
        # `python3 scripts/patch.py $(version) $(release)` which actually
        # applies every patch via GNU `patch` (see scripts/_mixin.py:patch).
        # The git repo is only for dev convenience (revert/checkpoint); the
        # commit/tag is why a git identity is required here. A patch failure
        # aborts here, blocking the matrix.
        env:
          BUILD_TARGET: linux,x86_64
          # This job only probes that the patches apply; it never compiles.
          # Skip rustup target installation so make dir does not depend on a
          # rust toolchain (and does not waste minutes downloading cross-target
          # std libraries). The real build matrix leaves this unset.
          CAMOUFOX_SKIP_RUSTUP: "1"
        run: |
          set -eux
          make dir
          echo "OK: all patches applied cleanly against Firefox $(grep ^version= upstream.sh | cut -d= -f2)"

  setup-matrix:
    # Emit the build matrix as JSON so a workflow_dispatch run can narrow it to
    # a single platform (only_target) while iterating, without re-compiling the
    # already-green legs. For tag pushes / PRs (and only_target=all) the full
    # 7-leg matrix is produced. Cheap (<10s), so it always runs.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: gen
        env:
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only_target || 'all' }}
        run: |
          set -eu
          full='[
            {"target":"linux","arch":"x86_64","runner":"ubuntu-24.04"},
            {"target":"linux","arch":"arm64","runner":"ubuntu-24.04-arm"},
            {"target":"linux","arch":"i686","runner":"ubuntu-24.04"},
            {"target":"windows","arch":"x86_64","runner":"ubuntu-24.04"},
            {"target":"windows","arch":"i686","runner":"ubuntu-24.04"},
            {"target":"macos","arch":"x86_64","runner":"ubuntu-24.04"},
            {"target":"macos","arch":"arm64","runner":"ubuntu-24.04"}
          ]'
          if [ "$ONLY" = "all" ]; then
            sel=$(echo "$full" | jq -c '{include: .}')
          else
            sel=$(echo "$full" | jq -c --arg t "$ONLY" '{include: [.[] | select(.target==$t)]}')
          fi
          echo "Selected matrix for ONLY='$ONLY': $sel"
          echo "matrix=$sel" >> "$GITHUB_OUTPUT"

  build:
    # Gate the 7-arch matrix build on test-python AND apply-check: pure-
    # python validators must pass and the patches must actually apply
    # against the freshly-extracted Firefox source before we burn CI
    # minutes on the cross builds.
    # The matrix is generated by setup-matrix so a workflow_dispatch run can
    # build a single platform (only_target) without re-compiling the already-
    # green legs. Tag pushes and PRs always get the full 7-leg matrix.
    needs: [test-python, build-utls-proxy, apply-check, setup-matrix]
    runs-on: ${{ matrix.runner }}
    # Needed so each build leg can upload its binary DIRECTLY to the GitHub
    # Release (on tag pushes). Release assets don't count against the 0.5 GB
    # Actions-artifact storage quota that a single 530 MB build blows.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - name: Maximize build space
        # Pinned to the immutable commit SHA of tag v4.1 (supply-chain
        # hardening: a moved tag can no longer inject code into our runner).
        uses: AdityaGarg8/remove-unwanted-software@8831c82abf29b34eb2caac48d5f999ecfc0d8eef # v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null || true
          sudo apt-get remove -y '^dotnet-.*' > /dev/null || true
          sudo apt-get remove -y '^llvm-.*' > /dev/null || true
          sudo apt-get remove -y 'php.*' > /dev/null || true
          sudo apt-get remove -y '^mongodb-.*' > /dev/null || true
          sudo apt-get remove -y '^mysql-.*' > /dev/null || true
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL:-} mono-devel libgl1-mesa-dri --fix-missing > /dev/null || true
          if [[ (${CODENAME:-} = focal) || (${CODENAME:-} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null || true
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null || true
          fi
          sudo apt-get autoremove -y > /dev/null || true
          sudo apt-get clean > /dev/null || true

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up LLVM
        # Install LLVM 18 from Ubuntu Noble's own repos (universe) instead of
        # bootstrapping via apt.llvm.org/llvm.sh. Noble ships clang-18,
        # lld-18, llvm-18 and libclang-18-dev natively, which removes the
        # "wget | sudo bash" supply-chain TOFU and the unsigned shell-script
        # download. The package contents (clang/lld/llvm tools with -18
        # suffix) are identical to what llvm.sh would have pulled in for
        # Firefox 150's clang-18 baseline.
        run: |
          sudo apt-get update
          sudo apt-get install -y lld-18 clang-18 llvm-18 libclang-18-dev
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-18 100
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
          sudo update-alternatives --install /usr/bin/lld-link lld-link /usr/bin/lld-link-18 100
          sudo update-alternatives --install /usr/bin/llvm-objdump llvm-objdump /usr/bin/llvm-objdump-18 100
          sudo update-alternatives --install /usr/bin/llvm-readelf llvm-readelf /usr/bin/llvm-readelf-18 100
          sudo update-alternatives --install /usr/bin/llvm-objcopy llvm-objcopy /usr/bin/llvm-objcopy-18 100
          sudo update-alternatives --install /usr/bin/llvm-ar llvm-ar /usr/bin/llvm-ar-18 100
          sudo update-alternatives --install /usr/bin/llvm-nm llvm-nm /usr/bin/llvm-nm-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            sudo dpkg --add-architecture i386
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential msitools p7zip-full aria2 wget zip unzip nasm yasm nodejs pkg-config libasound2-dev libgtk-3-dev libdbus-glib-1-dev libpulse-dev libx11-xcb-dev libxt-dev
          if [ "${{ matrix.target }}" = "linux" ] && [ "${{ matrix.arch }}" = "i686" ]; then
            # --force-overwrite is needed because libpango1.0-dev:i386 ships
            # the same arch-independent files as libpango1.0-dev:amd64 (e.g.
            # /usr/share/gir-1.0/Pango-1.0.gir) but with different content
            # between Ubuntu builds. amd64 was pulled in earlier as a
            # dependency of libgtk-3-dev (amd64). Both versions are valid
            # for our purposes, so let dpkg overwrite. Same pattern is used
            # by Mozilla's own multi-arch CI images.
            sudo apt-get install -y \
              -o Dpkg::Options::="--force-overwrite" \
              libasound2-dev:i386 libgtk-3-dev:i386 libdbus-glib-1-dev:i386 \
              libpulse-dev:i386 libx11-xcb-dev:i386 libxt-dev:i386
          fi
          # Windows is cross-compiled with Mozilla's bootstrapped clang-cl +
          # Visual Studio / Windows SDK (see the "Bootstrap Mozilla toolchain"
          # step + --enable-bootstrap). No MinGW/xwin/wine host packages needed.
          # macOS is cross-compiled with Mozilla's bootstrapped clang + SDK
          # (see the "Bootstrap macOS cross toolchain" step). `mach bootstrap`
          # installs whatever host packages it needs itself, so no osxcross
          # build prerequisites are required here.

      - name: Install Rust toolchain (Firefox 150 baseline)
        # Firefox 150 ships with Rust 1.94.0 and source-tree MSRV is 1.90.0.
        # Sources verified:
        #   https://firefox-source-docs.mozilla.org/writing-rust-code/update-policy.html
        #   https://searchfox.org/mozilla-central/source/python/mozboot/mozboot/util.py
        #     ("MINIMUM_RUST_VERSION = "1.90.0"")
        # The previous pin to 1.86.0 was below MSRV and produced
        # "post-cargo rustc archive-pack" failures on windows-gnu (the
        # symptom that motivated the LTO disable workaround). Pinning to
        # 1.94.0 matches upstream Firefox 150 release toolchain exactly.
        run: |
          set -eux
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          # Install the cross-compile std library for the matrix target.
          # Native targets (linux x86_64 on x86_64 runner, linux arm64 on
          # arm64 runner) need no extra target install.
          case "${{ matrix.target }}-${{ matrix.arch }}" in
            linux-i686)     rustup target add i686-unknown-linux-gnu ;;
            windows-x86_64) rustup target add x86_64-pc-windows-msvc ;;
            windows-i686)   rustup target add i686-pc-windows-msvc ;;
            macos-x86_64)   rustup target add x86_64-apple-darwin ;;
            macos-arm64)    rustup target add aarch64-apple-darwin ;;
          esac
          rustc --version
          cargo --version
          rustup target list --installed

      - name: Install cbindgen (Firefox 150 needs >= 0.29.1)
        # Ubuntu's apt cbindgen is 0.26.0, which Firefox 150 rejects
        # ("cbindgen version 0.26.0 is too old. At least version 0.29.1 is
        # required." from build/moz.configure/bindgen.configure). Install from
        # crates.io instead.
        #
        # C-1 (audit 2026-07-03): pin an EXACT version, not a floating range.
        # The old "^0.29" resolved to whatever the latest 0.29.x was at build
        # time; --locked only pins cbindgen's own Cargo.lock, NOT which cbindgen
        # version cargo selects. During the windows-only grind the range drifted
        # from a green 0.29.x to 0.29.4, which mistranslates BudgetType::COUNT
        # and silently broke all three Linux legs with no commit to blame (see
        # the "Fix cbindgen BudgetType::COUNT array size" step). An exact "="
        # pin makes the toolchain reproducible so a floating dep can never again
        # regress an already-green leg. Keep this in lockstep with the Dockerfile
        # (both install cbindgen 0.29.4) and bump both together, deliberately.
        run: |
          set -eux
          cargo install cbindgen --version "=0.29.4" --locked
          cbindgen --version

      - name: Fetch source
        run: |
          make fetch

      - name: Setup source
        run: |
          make setup-minimal
          mkdir -p dist

      - name: Bootstrap Mozilla toolchain (macOS + Windows cross)
        # Mirror upstream camoufox: use Mozilla's own bootstrapped toolchain
        # instead of hand-built cross toolchains. `mach bootstrap` provisions the
        # host build environment; the subsequent `mach build` (with
        # --enable-bootstrap from assets/base.mozconfig) auto-fetches the
        # target-specific toolchain during configure:
        #   * macos: Mozilla's cross clang for --target=*-apple-darwin. The macOS
        #     SDK is supplied separately by the next step (Mozilla's SDK artifact
        #     is Apple-licensed/private and 403s for external builds).
        #   * windows: clang-cl + the real Visual Studio / Windows SDK (ATL) that
        #     get_vs.py downloads from Microsoft to ~/.mozbuild/vs — the winsysroot
        #     Firefox's windows.configure needs. Retires the MinGW and xwin
        #     cross-toolchains and the mozjemalloc DllMain TLS deadlock with them.
        # Runs on the freshly extracted, not-yet-patched tree — bootstrap is
        # independent of the patch graph.
        if: matrix.target == 'macos' || matrix.target == 'windows'
        run: |
          set -eux
          src_dir="$(ls -d camoufox-*/ | head -n1)"
          cd "$src_dir"
          MOZBUILD_STATE_PATH="$HOME/.mozbuild" ./mach --no-interactive bootstrap --application-choice=browser

      - name: Fetch macOS SDK (Apple CDN, 26.5)
        # Mirror upstream camoufox: download Apple's official macOS 26.5 SDK via
        # Mozilla's unpack-sdk.py. The joseluisq mirror tops out at 26.1, which
        # LACKS the WebAuthn `prf` property FF152's dom/webauthn/
        # MacOSWebAuthnService.mm requires (build fails at ~52min: "property
        # 'prf' not found on ASAuthorizationSecurityKeyPublicKeyCredential*").
        # 26.5 also satisfies FF152's native mac_sdk_min_version=26.4, so the
        # former core/macos-sdk-min-version.patch (26.4->26.1) is dropped. Runs
        # after "Setup source" + bootstrap (mach + build venv available);
        # unpack-sdk.py SHA512-verifies the download itself.
        if: matrix.target == 'macos'
        run: |
          set -eux
          src_dir="$(ls -d camoufox-*/ | head -n1)"
          sdk_dir="$HOME/.mozbuild/MacOSX26.5.sdk"
          if [ ! -f "$sdk_dir/SDKSettings.plist" ]; then
            ( cd "$src_dir" && env -u MOZ_AUTOMATION ./mach --no-interactive python --virtualenv build \
                taskcluster/scripts/misc/unpack-sdk.py \
                https://swcdn.apple.com/content/downloads/09/08/047-91568-A_Y1CFZWQCD4/4xekpyz43i26dbp4enxfro8eb1q7wiujh5/CLTools_macOSNMOS_SDK.pkg \
                5db8b5a06a489a7d3ec587ebb7e01be55163128029923fc24edcad47faecd67830193c0d91e2643ee0e92f2ccca37adf20e4c42cf8de5784666f8663638b5cc5 \
                Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk \
                "$sdk_dir" )
          fi
          test -d "$sdk_dir"
          echo "MACOS_SDK_DIR=$sdk_dir" >> "$GITHUB_ENV"

      - name: Fix cbindgen BudgetType::COUNT array size (all platforms)
        # cbindgen >= 0.29.x mistranslates the associated-const array *size*
        # `BudgetType::COUNT` in gfx/wr/webrender/src/texture_cache.rs into a
        # bare, undeclared `COUNT` in the generated webrender_ffi_generated.h
        # (`constexpr static const BudgetType BudgetType_VALUES[COUNT]`), so any
        # TU that includes that header fails with "use of undeclared identifier
        # 'COUNT'". cbindgen evaluates target cfgs while generating, so the
        # broken line lands in the Linux-target header (compiled by
        # accessible/atk + accessible/base) but NOT the macOS-target one -- which
        # is why only the three Linux legs regressed once the floating `^0.29`
        # cbindgen pin drifted (build-0.11 on 2026-06-06 predates the bad
        # release; v0.29.4 has the bug). The windows leg already applies this
        # exact rewrite inside "Patch MinGW-specific Firefox source gaps" (#12);
        # this dedicated, ungated step makes it platform-agnostic so Linux/macOS
        # get it too. Idempotent: on windows this runs first and the windows
        # copy then finds nothing and no-ops. 7 == BudgetType::COUNT so the
        # rewrite is behaviourally identical; value-context uses (which end in
        # `)` not `]`) are deliberately left untouched. Must run after "Setup
        # source" (the tree is extracted) and before "Build" (cbindgen runs).
        run: |
          set -eux
          src_dir="$(ls -d camoufox-*/ | head -n1)"
          texcache="${src_dir}gfx/wr/webrender/src/texture_cache.rs"
          test -f "$texcache" || { echo "ERROR: $texcache not found"; exit 1; }
          if grep -qE '\[[^]]*BudgetType::COUNT\]' "$texcache"; then
            sed -i -E 's@(\[[^]]*); BudgetType::COUNT\]@\1; 7]@g' "$texcache"
            echo "rewrote BudgetType::COUNT array sizes to literal 7 in texture_cache.rs"
            grep -nE '\[[^]]*BudgetType::COUNT\]' "$texcache" && { echo "ERROR: array-size BudgetType::COUNT still present"; exit 1; } || true
          else
            echo "NOTE: no BudgetType::COUNT array sizes in texture_cache.rs; skipping."
          fi

      - name: Validate patch graph
        run: python3 ./scripts/validate_patches.py

      - name: Compile Python sources
        run: python3 -m compileall pythonlib/camoufox scripts

      - name: Create swap space
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build
        # Tee the entire build log to disk so we can attach it as an artifact
        # on failure. Without this, GitHub's UI truncates long output and the
        # actual error (often early C++ compile failures hidden behind a long
        # parallel rust build) is lost. Use PIPESTATUS to surface the real
        # exit code, since `tee` always succeeds.
        # MACH_BUILD_ARGS=--verbose is set for Windows so that mach passes
        # --verbose to gmake, disabling the -s (silent) flag and surfacing the
        # exact failing compiler/linker command in the artifact log.
        #
        # timeout-minutes caps the Build step BELOW the 360-minute job limit so
        # that a too-slow build is cut off as a *step* failure (which still runs
        # the always() log-upload below) instead of a hard job *cancellation*
        # (after which GitHub uploads nothing and the tee'd progress is lost --
        # exactly what happened to run 28132105096, which ran the full 6h then
        # was killed mid-link with no retrievable log).
        timeout-minutes: 335
        env:
          MACH_BUILD_ARGS: ${{ matrix.target == 'windows' && '--verbose' || '' }}
        run: |
          mkdir -p build-logs
          # Run the build under `script` so it executes against a pseudo-TTY.
          # Plain `| tee` loses the build output: mozbuild detects a non-TTY
          # stdout and stops streaming the per-command build log to stdout, so
          # the tee'd file ended at the post-source env dump with none of the
          # 335 minutes of compile/link output (and a step-timeout kill drops
          # GitHub's own live log too). A PTY makes mozbuild stream everything
          # live, line-buffered to the file on disk, so the always() upload
          # captures the real progress even when the step is killed. `-e`
          # propagates the child's exit code so a real build failure still fails
          # the step.
          # -f flushes the typescript after every write so the log on disk is
          # complete up to the kill -- without it script block-buffers and the
          # last (hanging) command is lost. stdbuf forces line buffering too.
          script -f -q -e -c "stdbuf -oL -eL python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}" "build-logs/build-${{ matrix.target }}-${{ matrix.arch }}.log"

      - name: Upload build log on failure
        # always() (not failure()): a Build-step timeout is reported as a
        # cancellation, under which failure() would not fire and we would again
        # lose the partial log. always() captures it regardless of outcome.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BuildLog-${{ matrix.target }}-${{ matrix.arch }}
          path: build-logs/*
          if-no-files-found: ignore
          # Logs are tiny but auto-expire fast so they never accumulate against
          # the 0.5 GB Actions-artifact quota.
          retention-days: 1

      - name: Upload binaries to release (tag pushes only)
        # The binaries go DIRECTLY to the GitHub Release, not to Actions-artifact
        # storage. A single build is ~530 MB — larger than the entire 0.5 GB
        # free Actions-artifact quota — so uploading 7 legs there fills the quota
        # and GitHub then cancels running jobs with a "runner received a shutdown
        # signal" (that is what repeatedly killed windows-x86_64). Release assets
        # are separate storage (generous for public repos) and cost nothing.
        # On non-tag runs (validation dispatches) there is no release, so this is
        # skipped and no binary is stored anywhere — the compile result is the
        # signal. softprops upserts the draft release: the first leg to finish
        # creates it, the rest append their (uniquely named) files. The pushed
        # tag already exists, so drafts are matched by tag (no duplicate drafts).
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: build
    # Gate the entire job on tag pushes instead of only the Create Release
    # step. Without this, the job spun up on every PR and `push` to a branch,
    # downloaded all 7 matrix artifacts (several GB), then no-op'd at the
    # Create Release step. Tag-gating at job level skips the runner entirely
    # for non-tag refs.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Finalize release notes
        # Binaries were already uploaded directly by each build leg (see "Upload
        # binaries to release"), so there is nothing to download — the old multi-
        # GB download-artifact + re-upload roundtrip is gone (it required storing
        # all 7 binaries in the 0.5 GB Actions quota, which is impossible). This
        # step only generates the release notes on the existing draft.
        # Pinned to the immutable commit SHA of tag v2.6.2 (supply-chain
        # hardening). softprops/action-gh-release runs with contents:write,
        # so a hijacked tag could tamper with published release assets.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
