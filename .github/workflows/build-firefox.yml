name: Build & Patch Firefox

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Firefox for Windows
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Firefox for Windows
        run: |
          cd camoufox_tuned
          python multibuild.py --target windows --arch x86_64 --bootstrap --clean

      - name: Upload Windows build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-windows
          path: camoufox_tuned/dist/
          retention-days: 30

  build-linux:
    name: Build Firefox for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip p7zip-full golang-go msitools wget aria2
          pip install -r camoufox_tuned/requirements.txt

      - name: Build Firefox for Linux
        run: |
          cd camoufox_tuned
          python multibuild.py --target linux --arch x86_64 --bootstrap --clean

      - name: Upload Linux build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-linux
          path: camoufox_tuned/dist/
          retention-days: 30

  build-macos:
    name: Build Firefox for macOS
    runs-on: macos-latest
    timeout-minutes: 240

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Firefox for macOS
        run: |
          cd camoufox_tuned
          python multibuild.py --target macos --arch x86_64 --bootstrap --clean

      - name: Upload macOS build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camoufox-macos
          path: camoufox_tuned/dist/
          retention-days: 30

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: build-${{ github.run_number }}
          release_name: Camoufox Build ${{ github.run_number }}
          body: |
            # Camoufox Firefox Build #${{ github.run_number }}

            Automatisch gebaut aus: ${{ github.sha }}

            ## Downloads
            - Windows: camoufox-windows.zip
            - Linux: camoufox-linux.tar.gz
            - macOS: camoufox-macos.dmg

            ## Build Info
            - Branch: ${{ github.ref }}
            - Committer: ${{ github.actor }}
            - Timestamp: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

